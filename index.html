<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的私人精裝書庫</title>
    <style>
        :root {
            --spine-gold: linear-gradient(90deg, rgba(255,215,0,0.3) 0%, rgba(255,255,255,0.1) 50%, rgba(255,215,0,0.3) 100%);
            --book-shadow: 5px 0 15px rgba(0,0,0,0.5);
            --shelf-wood: #3e2723;
        }

        body {
            margin: 0;
            padding: 0;
            /* 使用圖書館背景圖 */
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), 
                        url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=2000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            color: white;
            min-height: 100vh;
        }

        h1 { 
            text-align: center;
            margin: 60px 0 30px; 
            font-weight: 200; 
            letter-spacing: 10px; 
            text-shadow: 0 5px 15px rgba(0,0,0,1);
        }

        /* 三欄佈局：左右圖片，中間清單 */
        .library-layout {
            display: flex;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
        }

        .side-view {
            flex: 1;
            height: 100vh;
            opacity: 0.4;
            /* 讓兩側背景更有深度感 */
            mask-image: linear-gradient(to right, black 50%, transparent);
        }
        .side-view.right {
            mask-image: linear-gradient(to left, black 50%, transparent);
        }

        .collection-center {
            flex: 2;
            max-width: 1000px;
            padding: 0 20px 100px;
            z-index: 5;
        }

        .year-label {
            font-size: 1.2rem;
            color: #d7ccc8;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 10px;
            margin: 40px 0 20px;
            letter-spacing: 3px;
        }

        /* 書架與層板 */
        .shelf {
            position: relative;
            margin-bottom: 80px;
        }

        .books-row {
            display: flex;
            align-items: flex-end;
            padding: 0 10px 4px;
            gap: 2px; /* 精裝書靠得更近 */
            height: 240px;
            overflow-x: auto;
            scrollbar-width: none;
            cursor: grab;
        }
        .books-row::-webkit-scrollbar { display: none; }

        /* [核心修改] 精裝書脊設計 */
        .book {
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            flex-shrink: 0;
            border-radius: 1px 3px 3px 1px;
            /* 模擬精裝書的立體邊緣陰影 */
            box-shadow: inset 3px 0 5px rgba(0,0,0,0.3), inset -1px 0 2px rgba(255,255,255,0.1), var(--book-shadow);
            overflow: hidden;
        }

        /* 模擬精裝書表面的皮質感或紙質光澤 */
        .book::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, rgba(0,0,0,0.2) 0%, rgba(255,255,255,0.05) 50%, rgba(0,0,0,0.2) 100%);
            pointer-events: none;
        }

        .book:hover {
            transform: translateY(-25px) scale(1.02);
            z-index: 20;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        .spine-text {
            writing-mode: vertical-rl;
            color: rgba(255,255,255,0.9);
            font-size: 14px;
            font-weight: 500;
            line-height: 1.3;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px 0;
            word-break: break-all;
        }

        /* 木頭質感層板 */
        .shelf-board {
            height: 28px;
            background: linear-gradient(to bottom, #5d4037, #2b1d1a);
            width: 100%;
            border-radius: 2px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.8);
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        /* 彈窗：精裝書開啟感 */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); }
        .modal-content { margin: 5vh auto; width: 90%; max-width: 1100px; position: relative; }
        .open-book { display: flex; background-color: #fff; box-shadow: 0 40px 100px rgba(0,0,0,0.8); height: 85vh; border-radius: 4px; overflow: hidden; }
        .page { flex: 1; padding: 40px; overflow-y: auto; color: #2c3e50; scrollbar-width: none; }
        .page.left { background: #fafafa; border-right: 1px solid #ddd; }
        .page.right { background: #fff; }
        .book-spine-crease { width: 20px; background: linear-gradient(to right, #ccc, #eee 50%, #ccc); flex-shrink: 0; }

        .highlight-item { background: #f5f5f5; padding: 15px; margin-bottom: 10px; border-left: 4px solid #8d6e63; color: #444; line-height: 1.8; border-radius: 4px; }
        .close-btn { position: absolute; right: -50px; top: -10px; font-size: 50px; color: white; cursor: pointer; }

        @media (max-width: 1000px) {
            .side-view { display: none; }
        }
    </style>
</head>
<body>

    <h1>CURATED ARCHIVE</h1>

    <div class="library-layout">
        <div class="side-view"></div>

        <div class="collection-center" id="main-bookshelf">
            </div>

        <div class="side-view right"></div>
    </div>

    <div id="note-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="open-book">
                <div class="page left">
                    <div style="display: flex; gap: 20px; margin-bottom: 30px;">
                        <img id="modal-cover-img" style="width: 120px; border-radius: 4px; box-shadow: 0 5px 15px rgba(0,0,0,0.2);" src="" alt="">
                        <div>
                            <h2 id="modal-title" style="margin: 0 0 10px 0;"></h2>
                            <div id="modal-author" style="color: #666;"></div>
                            <div id="modal-rating" style="color: #f1c40f; margin: 10px 0;"></div>
                            <div id="modal-date" style="font-size: 0.8rem; background: #eee; padding: 3px 10px; border-radius: 10px; display: inline-block;"></div>
                        </div>
                    </div>
                    <div id="modal-highlights"></div>
                </div>
                <div class="book-spine-crease"></div>
                <div class="page right">
                    <div style="font-size: 0.8rem; color: #8d6e63; font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid #eee;">MY THOUGHTS</div>
                    <div id="modal-thoughts" style="line-height: 2; color: #333; white-space: pre-wrap;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function init() {
            try {
                const response = await fetch('books.json');
                const data = await response.json();
                data.sort((a, b) => b.year - a.year); 
                renderBookshelf(data);
                enableDragScroll();
            } catch (e) { console.error("Error loading shelf"); }
        }

        function renderBookshelf(data) {
            const mainContainer = document.getElementById('main-bookshelf');
            mainContainer.innerHTML = '';
            const years = [...new Set(data.map(b => b.year))].sort((a, b) => b - a);

            years.forEach(year => {
                const section = document.createElement('div');
                section.innerHTML = `
                    <div class="year-label">${year} COLLECTION</div>
                    <div class="shelf">
                        <div class="books-row" id="shelf-${year}"></div>
                        <div class="shelf-board"></div>
                    </div>
                `;
                mainContainer.appendChild(section);

                const row = document.getElementById(`shelf-${year}`);
                data.filter(b => b.year === year).forEach(book => {
                    const bookEl = document.createElement('div');
                    bookEl.className = 'book';
                    bookEl.style.backgroundColor = book.color || '#2c3e50';
                    bookEl.style.height = `${book.height || 190}px`;
                    // 動態書脊寬度
                    const dynamicWidth = book.title.length > 7 ? 68 : 50;
                    bookEl.style.width = `${dynamicWidth}px`;
                    
                    bookEl.innerHTML = `<div class="spine-text">${book.title}</div>`;
                    bookEl.onclick = () => openNote(book);
                    row.appendChild(bookEl);
                });
            });
        }

        function enableDragScroll() {
            const sliders = document.querySelectorAll('.books-row');
            sliders.forEach(slider => {
                let isDown = false, startX, scrollLeft;
                slider.addEventListener('mousedown', (e) => { isDown = true; startX = e.pageX - slider.offsetLeft; scrollLeft = slider.scrollLeft; });
                slider.addEventListener('mouseleave', () => isDown = false);
                slider.addEventListener('mouseup', () => isDown = false);
                slider.addEventListener('mousemove', (e) => { if (!isDown) return; e.preventDefault(); const x = e.pageX - slider.offsetLeft; const walk = (x - startX) * 2; slider.scrollLeft = scrollLeft - walk; });
            });
        }

        function openNote(book) {
            document.getElementById('modal-title').innerText = book.title;
            document.getElementById('modal-author').innerText = book.author;
            document.getElementById('modal-rating').innerText = book.rating;
            document.getElementById('modal-date').innerText = `Finished in ${book.year}`;
            const coverImg = document.getElementById('modal-cover-img');
            coverImg.src = book.cover || '';
            coverImg.style.display = book.cover ? 'block' : 'none';

            let thoughts = "No notes", rawHighlights = "";
            if (book.note) {
                const parts = book.note.split('【劃線金句】');
                thoughts = parts[0].replace('【我的心得】', '').trim();
                rawHighlights = parts[1] ? parts[1].trim() : "";
            }

            const hContainer = document.getElementById('modal-highlights');
            hContainer.innerHTML = '';
            if (rawHighlights) {
                rawHighlights.split(/\n\s*\n/).forEach(text => {
                    const item = document.createElement('div');
                    item.className = 'highlight-item';
                    item.innerText = text.trim();
                    hContainer.appendChild(item);
                });
            }
            document.getElementById('modal-thoughts').innerText = thoughts;
            document.getElementById('note-modal').style.display = "block";
        }

        function closeModal() { document.getElementById('note-modal').style.display = "none"; }
        window.onclick = (e) => { if (e.target.className === 'modal') closeModal(); }
        init();
    </script>
</body>
</html>
