<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的私人典藏館 | Luxury Archive</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --gold-bright: #ffd700;
            --gold-text: #eec16d;
            --shelf-wood: #2b1d1a;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=2000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            font-family: "Georgia", "PingFang TC", "serif";
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 { 
            text-align: center;
            margin: 60px 0; 
            font-weight: bold; 
            letter-spacing: 12px; 
            text-shadow: 0 5px 15px rgba(0,0,0,0.8);
            color: var(--gold-text);
        }

        .collection-center {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px 100px;
            z-index: 5;
        }

        /* 年份標題：金色、置左、包含數量 */
        .year-label {
            font-size: 1.6rem;
            color: var(--gold-bright);
            border-bottom: 2px solid rgba(255, 215, 0, 0.4);
            padding-bottom: 12px;
            margin: 80px 0 30px;
            letter-spacing: 3px;
            text-align: left;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            display: flex;
            align-items: baseline;
        }
        .book-count {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.6);
            margin-left: 15px;
            font-weight: normal;
        }

        /* 書架容器 */
        .shelf { position: relative; margin-bottom: 80px; }
        
        .books-row {
            display: flex;
            align-items: flex-end;
            padding: 0 10px 8px;
            gap: 5px;
            height: 320px;
            overflow-x: auto;
            scrollbar-width: none;
            cursor: grab;
            user-select: none;
        }
        .books-row::-webkit-scrollbar { display: none; }
        .books-row:active { cursor: grabbing; }

        /* 精裝書脊樣式 */
        .book {
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            flex-shrink: 0;
            border-radius: 2px 5px 5px 2px;
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            /* 輕微的左右陰影營造弧度 */
            background-image: linear-gradient(to right, rgba(0,0,0,0.1) 0%, transparent 15%, transparent 85%, rgba(0,0,0,0.1) 100%);
            box-shadow: inset 3px 0 5px rgba(0,0,0,0.2), 5px 5px 15px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px 8px;
            box-sizing: border-box;
        }

        .book:hover {
            transform: translateY(-25px);
            z-index: 50;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            filter: brightness(1.1);
        }

        /* 書名：水平由左至右折行 */
        .spine-text {
            writing-mode: horizontal-tb;
            width: 100%;
            text-align: center;
            color: #fcf4d9;
            font-size: 14px;
            font-weight: bold;
            line-height: 1.3;
            letter-spacing: 1px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            word-wrap: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 8; /* 最多顯示8行 */
            -webkit-box-orient: vertical;
            overflow: hidden;
            pointer-events: none;
        }

        .shelf-board {
            height: 35px;
            background: linear-gradient(to bottom, #3e2723, #1a0f0d);
            width: 100%;
            border-radius: 2px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        /* 彈窗樣式：使用 book_open.png 作為背景 */
        .modal { 
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0; top: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); 
            backdrop-filter: blur(10px); 
        }

        .modal-container {
            position: relative;
            width: 95%;
            max-width: 1100px;
            margin: 5vh auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .open-book-bg {
            width: 100%;
            height: 85vh;
            background: url('https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_open.png') no-repeat center center;
            background-size: contain;
            display: flex;
            padding: 5% 8%; /* 讓內容落在書頁範圍內 */
            box-sizing: border-box;
        }

        .page {
            flex: 1;
            height: 100%;
            overflow-y: auto;
            padding: 20px 30px;
            color: #333;
            scrollbar-width: none;
        }
        .page::-webkit-scrollbar { display: none; }

        /* 上一本/下一本按鈕 */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--gold-bright);
            color: var(--gold-bright);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            z-index: 1100;
            font-size: 1.2rem;
        }
        .nav-btn:hover { background: var(--gold-bright); color: #000; }
        .prev-btn { left: -70px; }
        .next-btn { right: -70px; }

        .close-btn {
            position: absolute;
            top: -40px;
            right: 0;
            font-size: 40px;
            color: white;
            cursor: pointer;
        }

        .modal-header { display: flex; gap: 20px; margin-bottom: 25px; align-items: flex-start; }
        .modal-cover { width: 120px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); border-radius: 3px; }
        .modal-info h2 { margin: 0; font-family: serif; color: #111; font-size: 1.5rem; }
        .highlight-item { background: rgba(212, 175, 55, 0.1); padding: 15px; margin-bottom: 12px; border-left: 4px solid var(--gold-bright); color: #444; border-radius: 2px; font-size: 0.95rem; }
        .thought-title { font-weight: bold; color: #b8860b; border-bottom: 1px solid #ddd; margin-bottom: 15px; padding-bottom: 5px; letter-spacing: 2px; }

        @media (max-width: 1200px) {
            .prev-btn { left: 10px; }
            .next-btn { right: 10px; }
            .open-book-bg { background-size: cover; padding: 40px 20px; }
        }
    </style>
</head>
<body>

    <h1>PRIVATE LIBRARY</h1>

    <div class="collection-center" id="main-bookshelf"></div>

    <div id="book-modal" class="modal">
        <div class="modal-container">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            
            <div class="nav-btn prev-btn" onclick="changeBook(-1)"><i class="fas fa-chevron-left"></i></div>
            <div class="nav-btn next-btn" onclick="changeBook(1)"><i class="fas fa-chevron-right"></i></div>

            <div class="open-book-bg">
                <div class="page" id="page-left">
                    <div class="modal-header">
                        <img id="m-cover" class="modal-cover" src="" alt="">
                        <div class="modal-info">
                            <h2 id="m-title"></h2>
                            <p id="m-author" style="color: #666; font-style: italic;"></p>
                            <div id="m-rating" style="color: #d4af37; margin: 10px 0;"></div>
                            <div id="m-date" style="font-size: 0.75rem; color: #999;"></div>
                        </div>
                    </div>
                    <div id="m-highlights"></div>
                </div>
                <div class="page" id="page-right">
                    <div class="thought-title">閱讀感悟</div>
                    <div id="m-thoughts" style="line-height: 1.8; white-space: pre-wrap;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const bookBackgrounds = [
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg1.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg2.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg3.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg4.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg5.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg6.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg7.png'
        ];

        let allBooks = [];
        let currentYearBooks = [];
        let currentIdx = -1;

        async function init() {
            try {
                const response = await fetch('books.json');
                const data = await response.json();
                // 整個資料反轉，讓最新資料在最左邊
                allBooks = data.reverse(); 
                renderBookshelf();
                enableDragScroll();
            } catch (e) { console.error("Load Error"); }
        }

        function renderBookshelf() {
            const container = document.getElementById('main-bookshelf');
            container.innerHTML = '';
            const years = [...new Set(allBooks.map(b => b.year))].sort((a, b) => b - a);

            years.forEach(year => {
                const yearBooks = allBooks.filter(b => b.year === year);
                const section = document.createElement('div');
                section.innerHTML = `
                    <div class="year-label">
                        ${year} COLLECTION 
                        <span class="book-count">(${yearBooks.length} BOOKS)</span>
                    </div>
                    <div class="shelf">
                        <div class="books-row" id="shelf-${year}"></div>
                        <div class="shelf-board"></div>
                    </div>
                `;
                container.appendChild(section);

                const row = document.getElementById(`shelf-${year}`);
                yearBooks.forEach((book, index) => {
                    const bookEl = document.createElement('div');
                    bookEl.className = 'book';
                    
                    const bg = bookBackgrounds[Math.floor(Math.random() * bookBackgrounds.length)];
                    const h = 220 + Math.floor(Math.random() * 40);
                    const w = book.title.length > 7 ? 80 : 60; // 寬度稍微加寬以利折行
                    
                    bookEl.style.backgroundImage = `linear-gradient(to right, rgba(0,0,0,0.1) 0%, transparent 15%, transparent 85%, rgba(0,0,0,0.1) 100%), url('${bg}')`;
                    bookEl.style.height = `${h}px`;
                    bookEl.style.width = `${w}px`;
                    
                    bookEl.innerHTML = `<div class="spine-text">${book.title}</div>`;
                    bookEl.onclick = () => openModal(yearBooks, index);
                    row.appendChild(bookEl);
                });
            });
        }

        function openModal(booksArray, index) {
            currentYearBooks = booksArray;
            currentIdx = index;
            updateModalContent();
            document.getElementById('book-modal').style.display = "block";
        }

        function updateModalContent() {
            const book = currentYearBooks[currentIdx];
            document.getElementById('m-title').innerText = book.title;
            document.getElementById('m-author').innerText = book.author;
            document.getElementById('m-rating').innerText = book.rating;
            document.getElementById('m-date').innerText = `Catalogued: ${book.year}`;
            
            const img = document.getElementById('m-cover');
            img.src = book.cover || '';
            img.style.display = book.cover ? 'block' : 'none';

            let thoughts = "暫無心得記錄。", highlights = "";
            if (book.note) {
                const parts = book.note.split('【劃線金句】');
                thoughts = parts[0].replace('【我的心得】', '').trim();
                highlights = parts[1] ? parts[1].trim() : "";
            }

            const hContainer = document.getElementById('m-highlights');
            hContainer.innerHTML = '';
            if (highlights) {
                highlights.split(/\n\s*\n/).forEach(text => {
                    const div = document.createElement('div');
                    div.className = 'highlight-item';
                    div.innerText = text.trim();
                    hContainer.appendChild(div);
                });
            }
            document.getElementById('m-thoughts').innerText = thoughts;

            // 控制導航按鈕顯示
            document.querySelector('.prev-btn').style.visibility = (currentIdx > 0) ? 'visible' : 'hidden';
            document.querySelector('.next-btn').style.visibility = (currentIdx < currentYearBooks.length - 1) ? 'visible' : 'hidden';
        }

        function changeBook(step) {
            const newIdx = currentIdx + step;
            if (newIdx >= 0 && newIdx < currentYearBooks.length) {
                currentIdx = newIdx;
                updateModalContent();
            }
        }

        function enableDragScroll() {
            const sliders = document.querySelectorAll('.books-row');
            sliders.forEach(slider => {
                let isDown = false, startX, scrollLeft;
                slider.addEventListener('mousedown', (e) => {
                    isDown = true;
                    startX = e.pageX - slider.offsetLeft;
                    scrollLeft = slider.scrollLeft;
                });
                slider.addEventListener('mouseleave', () => isDown = false);
                slider.addEventListener('mouseup', () => isDown = false);
                slider.addEventListener('mousemove', (e) => {
                    if (!isDown) return;
                    e.preventDefault();
                    const x = e.pageX - slider.offsetLeft;
                    const walk = (x - startX) * 2;
                    slider.scrollLeft = scrollLeft - walk;
                });
            });
        }

        function closeModal() { document.getElementById('book-modal').style.display = "none"; }
        window.onclick = (e) => { if (e.target.className === 'modal') closeModal(); }

        // 鍵盤支援
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('book-modal').style.display === "block") {
                if (e.key === "ArrowLeft") changeBook(-1);
                if (e.key === "ArrowRight") changeBook(1);
                if (e.key === "Escape") closeModal();
            }
        });

        init();
    </script>
</body>
</html>
