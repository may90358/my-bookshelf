<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的私藏圖書館 | Notion Bookshelf</title>
    <style>
        :root {
            --wood-dark: #3e2723;
            --wood-light: #5d4037;
            --shelf-shadow: rgba(0,0,0,0.6);
            --paper-color: #fafafa;
        }

        /* 1. 滿版背景設定 */
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=2000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { 
            margin: 40px 0; 
            font-weight: 300; 
            letter-spacing: 5px; 
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
            z-index: 10;
        }

        /* 2. 三欄式書架結構 */
        .library-wrapper {
            display: flex;
            width: 100%;
            max-width: 1600px;
            justify-content: center;
            gap: 0;
        }

        /* 兩側假書裝飾區 */
        .fake-shelf {
            flex: 1;
            opacity: 0.3;
            filter: blur(2px);
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 100px;
            padding-top: 50px;
        }

        /* 中間真實書籍區 */
        .main-library {
            flex: 2;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(3px);
            padding: 20px 40px 100px;
            min-height: 100vh;
            border-left: 1px solid rgba(255,255,255,0.1);
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        .year-section { margin-top: 40px; }
        .year-label { 
            font-size: 1.6rem; 
            margin-bottom: 20px; 
            color: #d7ccc8;
            border-bottom: 1px solid rgba(215, 204, 200, 0.3);
            display: inline-block;
            padding-right: 50px;
        }
        
        /* 3. 木質感書架層板 */
        .shelf { 
            position: relative; 
            margin-bottom: 60px; 
        }
        
        .books-row { 
            display: flex; 
            align-items: flex-end; 
            padding: 0 15px 5px; 
            gap: 4px; 
            height: 220px; 
            z-index: 2; 
            position: relative; 
            overflow-x: auto; 
            scrollbar-width: none; 
            cursor: grab;
        }
        .books-row::-webkit-scrollbar { display: none; }

        .book { 
            cursor: pointer; 
            transition: all 0.3s ease; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            box-shadow: 3px 0 10px rgba(0,0,0,0.5); 
            border-radius: 2px 4px 4px 2px; 
            border-left: 3px solid rgba(255,255,255,0.1); 
            flex-shrink: 0; 
            min-width: 45px;
            padding: 0 5px;
        }
        .book:hover { transform: translateY(-15px) scale(1.05); z-index: 10; box-shadow: 0 15px 30px rgba(0,0,0,0.8); }

        .spine-text { 
            writing-mode: vertical-rl; 
            color: white; 
            font-size: 13px; 
            line-height: 1.2;
            word-break: break-all;
            pointer-events: none;
        }

        .shelf-board { 
            height: 25px; 
            background: linear-gradient(to bottom, #795548, #3e2723);
            width: 100%; 
            border-radius: 2px; 
            box-shadow: 0 10px 20px var(--shelf-shadow);
            border-top: 1px solid rgba(255,255,255,0.2);
        }

        /* 4. 彈窗 UI (保持精裝書質感) */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); backdrop-filter: blur(8px); perspective: 2000px; }
        .modal-content { margin: 5vh auto; width: 90%; max-width: 1100px; position: relative; }
        .open-book { display: flex; background-color: #fff; border-bottom: 8px solid #bbb; border-right: 5px solid #bbb; box-shadow: 0 30px 60px rgba(0,0,0,0.5); border-radius: 4px; height: 85vh; overflow: hidden; }
        .page { flex: 1; padding: 40px; overflow-y: auto; color: #2c3e50; display: flex; flex-direction: column; scrollbar-width: none; }
        .page::-webkit-scrollbar { display: none; }
        .page.left { background-image: linear-gradient(to right, #fafafa 95%, #e0e0e0 100%); border-right: 1px solid rgba(0,0,0,0.05); }
        .page.right { background-image: linear-gradient(to left, #ffffff 95%, #e0e0e0 100%); }
        .book-spine-crease { width: 15px; background: linear-gradient(to right, #dcdcdc, #ffffff 50%, #dcdcdc); flex-shrink: 0; }

        .left-page-header { display: flex; align-items: flex-start; gap: 25px; margin-bottom: 30px; }
        .book-cover-small { width: 130px; height: auto; border-radius: 4px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); flex-shrink: 0; }
        .modal-title { font-size: 1.5rem; margin: 0 0 10px 0; font-weight: bold; }
        .modal-author { font-size: 1rem; color: #555; margin-bottom: 8px; }
        .modal-rating { font-size: 1.1rem; color: #f1c40f; margin-bottom: 12px; }
        .modal-date { font-size: 0.8rem; color: #888; background: #eee; padding: 4px 12px; border-radius: 12px; width: fit-content; }

        .highlight-container { display: flex; flex-direction: column; gap: 15px; }
        .highlight-item { line-height: 1.8; color: #444; background: rgba(0,0,0,0.05); padding: 15px 20px; border-radius: 10px; border-left: 4px solid var(--wood-light); }
        .thought-section { line-height: 2.1; font-size: 1.1rem; white-space: pre-wrap; }
        .section-label { font-size: 0.85rem; color: var(--wood-light); font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px; }
        .close-btn { position: absolute; right: -40px; top: -20px; font-size: 50px; cursor: pointer; color: #fff; z-index: 1001; }

        @media (max-width: 1000px) {
            .fake-shelf { display: none; }
            .main-library { flex: 1; width: 100%; }
        }
    </style>
</head>
<body>

    <h1>PRIVATE LIBRARY</h1>

    <div class="library-wrapper">
        <div class="fake-shelf">
            <div class="shelf"><div class="books-row"></div><div class="shelf-board"></div></div>
            <div class="shelf"><div class="books-row"></div><div class="shelf-board"></div></div>
            <div class="shelf"><div class="books-row"></div><div class="shelf-board"></div></div>
        </div>

        <div class="main-library" id="main-bookshelf"></div>

        <div class="fake-shelf">
            <div class="shelf"><div class="books-row"></div><div class="shelf-board"></div></div>
            <div class="shelf"><div class="books-row"></div><div class="shelf-board"></div></div>
            <div class="shelf"><div class="books-row"></div><div class="shelf-board"></div></div>
        </div>
    </div>

    <div id="note-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="open-book">
                <div class="page left">
                    <div class="left-page-header">
                        <img id="modal-cover-img" class="book-cover-small" src="" alt="">
                        <div class="book-info-text">
                            <h2 id="modal-title" class="modal-title"></h2>
                            <div id="modal-author" class="modal-author"></div>
                            <div id="modal-rating" class="modal-rating"></div>
                            <div id="modal-date" class="modal-date"></div>
                        </div>
                    </div>
                    <div id="modal-highlights" class="highlight-container"></div>
                </div>
                <div class="book-spine-crease"></div>
                <div class="page right">
                    <span class="section-label">【 我 的 心 得 】</span>
                    <div id="modal-thoughts" class="thought-section"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function init() {
            try {
                const response = await fetch('books.json');
                const data = await response.json();
                data.sort((a, b) => b.year - a.year); 
                renderBookshelf(data);
                enableDragScroll();
            } catch (e) { console.error("Error"); }
        }

        function renderBookshelf(data) {
            const mainContainer = document.getElementById('main-bookshelf');
            mainContainer.innerHTML = '';
            const years = [...new Set(data.map(b => b.year))].sort((a, b) => b - a);

            years.forEach(year => {
                const section = document.createElement('div');
                section.className = 'year-section';
                section.innerHTML = `
                    <div class="year-label">${year} REFERENCE</div>
                    <div class="shelf">
                        <div class="books-row" id="shelf-${year}"></div>
                        <div class="shelf-board"></div>
                    </div>
                `;
                mainContainer.appendChild(section);

                const row = document.getElementById(`shelf-${year}`);
                data.filter(b => b.year === year).forEach(book => {
                    const bookEl = document.createElement('div');
                    bookEl.className = 'book';
                    bookEl.style.backgroundColor = book.color || '#2c3e50';
                    bookEl.style.height = `${book.height || 180}px`;
                    const dynamicWidth = book.title.length > 6 ? 65 : 48;
                    bookEl.style.width = `${dynamicWidth}px`;
                    bookEl.innerHTML = `<div class="spine-text">${book.title}</div>`;
                    bookEl.onclick = () => openNote(book);
                    row.appendChild(bookEl);
                });
            });
        }

        function enableDragScroll() {
            const sliders = document.querySelectorAll('.books-row');
            sliders.forEach(slider => {
                let isDown = false, startX, scrollLeft;
                slider.addEventListener('mousedown', (e) => { isDown = true; startX = e.pageX - slider.offsetLeft; scrollLeft = slider.scrollLeft; });
                slider.addEventListener('mouseleave', () => isDown = false);
                slider.addEventListener('mouseup', () => isDown = false);
                slider.addEventListener('mousemove', (e) => { if (!isDown) return; e.preventDefault(); const x = e.pageX - slider.offsetLeft; const walk = (x - startX) * 2; slider.scrollLeft = scrollLeft - walk; });
            });
        }

        function openNote(book) {
            document.getElementById('modal-title').innerText = book.title;
            document.getElementById('modal-author').innerText = book.author;
            document.getElementById('modal-rating').innerText = book.rating;
            document.getElementById('modal-date').innerText = `Finished: ${book.year}`;
            const coverImg = document.getElementById('modal-cover-img');
            coverImg.src = book.cover || '';
            coverImg.style.display = book.cover ? 'block' : 'none';

            let thoughts = "尚無紀錄", rawHighlights = "";
            if (book.note) {
                const parts = book.note.split('【劃線金句】');
                thoughts = parts[0].replace('【我的心得】', '').trim() || "無紀錄";
                rawHighlights = parts[1] ? parts[1].trim() : "";
            }

            const highlightContainer = document.getElementById('modal-highlights');
            highlightContainer.innerHTML = '';
            if (rawHighlights) {
                const blocks = rawHighlights.split(/\n\s*\n/).filter(b => b.trim().length > 0);
                blocks.forEach(text => {
                    const item = document.createElement('div');
                    item.className = 'highlight-item';
                    item.innerText = text.trim();
                    highlightContainer.appendChild(item);
                });
            }
            document.getElementById('modal-thoughts').innerText = thoughts;
            document.getElementById('note-modal').style.display = "block";
        }

        function closeModal() { document.getElementById('note-modal').style.display = "none"; }
        window.onclick = (e) => { if (e.target.className === 'modal') closeModal(); }
        init();
    </script>
</body>
</html>
