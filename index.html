<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的私人典藏館 | Luxury Archive</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --gold-bright: #ffd700;
            --gold-text: #eec16d;
            --shelf-wood: #2b1d1a;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=2000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            font-family: "Georgia", "PingFang TC", "serif";
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 { 
            text-align: center;
            margin: 40px 0; 
            font-weight: bold; 
            letter-spacing: 12px; 
            text-shadow: 0 5px 15px rgba(0,0,0,0.8);
            color: var(--gold-text);
            font-size: 2rem;
        }

        .collection-center {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 100px;
            z-index: 5;
        }

        .year-label {
            font-size: 1.4rem;
            color: var(--gold-bright);
            border-bottom: 2px solid rgba(255, 215, 0, 0.4);
            padding-bottom: 10px;
            margin: 50px 0 20px;
            letter-spacing: 3px;
            text-align: left;
            font-weight: bold;
            display: flex;
            align-items: baseline;
        }

        .book-count {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            margin-left: 15px;
            font-family: sans-serif;
            font-weight: normal;
        }

        .shelf { position: relative; margin-bottom: 60px; }
        
        .books-row {
            display: flex;
            align-items: flex-end;
            padding: 0 10px 5px;
            gap: 2px; 
            height: 280px;
            overflow-x: auto;
            scrollbar-width: none;
            cursor: grab;
            user-select: none;
        }
        .books-row::-webkit-scrollbar { display: none; }
        .books-row:active { cursor: grabbing; }

        .book {
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            flex-shrink: 0;
            border-radius: 2px 5px 5px 2px;
            background-size: 100% 100%;
            background-position: center;
            background-image: linear-gradient(to right, rgba(0,0,0,0.1) 0%, transparent 15%, transparent 85%, rgba(0,0,0,0.1) 100%);
            box-shadow: inset 4px 0 6px -2px rgba(0,0,0,0.3), 4px 5px 15px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .book:hover {
            transform: translateY(-20px);
            z-index: 50;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            filter: brightness(1.1);
        }

        .spine-text {
            writing-mode: vertical-rl; 
            direction: ltr;           
            color: #fcf4d9;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
            padding: 13px 0;
            text-align: center;
            pointer-events: none;
            word-break: break-all;
            max-height: 135px; 
            display: flex;
            flex-direction: row; 
            justify-content: center;
        }

        .shelf-board {
            height: 25px;
            background: linear-gradient(to bottom, #4e342e, #1a0f0d);
            width: 100%;
            border-radius: 2px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        /* --- 彈窗樣式 --- */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); backdrop-filter: blur(10px); }
        
        .modal-container {
            position: relative;
            width: 92%;
            max-width: 1000px;
            margin: 3vh auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .open-book { 
            display: flex; 
            background-color: #fff; 
            box-shadow: 0 50px 100px rgba(0,0,0,0.9); 
            height: 88vh; 
            width: 100%;
            border-radius: 4px; 
            overflow: hidden; 
            transition: flex-direction 0.3s ease;
        }
        
        .page { 
            flex: 1; 
            padding: 40px; 
            overflow-y: auto; 
            color: #333; 
            scrollbar-width: none; 
        }
        .page::-webkit-scrollbar { display: none; }
        .page.left { background: #fafafa; border-right: 1px solid #eee; }
        .book-spine-crease { width: 20px; background: linear-gradient(to right, #ddd, #fff 50%, #ddd); flex-shrink: 0; }
        
        /* 導航按鈕 (桌面版) */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--gold-bright);
            color: var(--gold-bright);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            z-index: 1100;
        }
        .nav-btn:hover { background: var(--gold-bright); color: #000; }
        .prev-btn { left: -70px; }
        .next-btn { right: -70px; }

        .close-btn { position: absolute; right: -50px; top: -10px; font-size: 50px; color: white; cursor: pointer; z-index: 1200; }
        .highlight-item { background: #f8f5f0; padding: 15px; margin-bottom: 12px; border-left: 5px solid var(--gold-bright); color: #555; line-height: 1.8; font-size: 0.95rem; }

        /* --- 手機版 RWD 調整 --- */
        @media (max-width: 800px) {
            h1 { font-size: 1.5rem; letter-spacing: 5px; margin: 30px 0; }
            .collection-center { padding: 0 15px 60px; }
            
            /* 書籍內頁改為上下堆疊 */
            .open-book { flex-direction: column; height: 90vh; }
            .page { flex: none; width: 100%; height: 50%; padding: 25px; box-sizing: border-box; }
            .page.left { border-right: none; border-bottom: 1px solid #eee; }
            
            /* 書脊摺痕改為水平方向 */
            .book-spine-crease { width: 100%; height: 12px; background: linear-gradient(to bottom, #ddd, #fff 50%, #ddd); }

            /* 導航按鈕移動到下方 */
            .nav-btn { top: auto; bottom: -60px; transform: none; width: 45px; height: 45px; }
            .prev-btn { left: 20%; }
            .next-btn { right: 20%; }

            /* 關閉按鈕移動到右上角內部 */
            .close-btn { right: 0; top: -55px; font-size: 40px; }

            .modal-container { margin: 6vh auto; }
        }

        @media (max-width: 500px) {
            .prev-btn { left: 10%; }
            .next-btn { right: 10%; }
        }
    </style>
</head>
<body>

    <h1>PRIVATE LIBRARY</h1>

    <div class="collection-center" id="main-bookshelf"></div>

    <div id="book-modal" class="modal">
        <div class="modal-container">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            
            <div class="nav-btn prev-btn" onclick="changeBook(-1)"><i class="fas fa-chevron-left"></i></div>
            <div class="nav-btn next-btn" onclick="changeBook(1)"><i class="fas fa-chevron-right"></i></div>

            <div class="open-book">
                <div class="page left">
                    <div style="display: flex; gap: 15px; margin-bottom: 20px;">
                        <img id="m-cover" style="width: 100px; border-radius: 3px; box-shadow: 0 5px 12px rgba(0,0,0,0.15);" src="" alt="">
                        <div style="flex: 1;">
                            <h2 id="m-title" style="margin: 0 0 8px 0; font-family: serif; font-size: 1.3rem; line-height: 1.2;"></h2>
                            <div id="m-author" style="color: #666; font-size: 0.9rem;"></div>
                            <div id="m-rating" style="color: #d4af37; margin: 8px 0; font-size: 1rem;"></div>
                            <div id="m-date" style="font-size: 0.75rem; background: #f0f0f0; padding: 2px 8px; border-radius: 8px; display: inline-block; color: #777;"></div>
                        </div>
                    </div>
                    <div id="m-highlights"></div>
                </div>
                <div class="book-spine-crease"></div>
                <div class="page">
                    <div style="font-size: 0.75rem; color: #b8860b; font-weight: bold; margin-bottom: 12px; border-bottom: 1px solid #eee; letter-spacing: 1px;">REFLECTIONS</div>
                    <div id="m-thoughts" style="line-height: 1.8; white-space: pre-wrap; font-size: 1rem;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const bookBackgrounds = [
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg1.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg2.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg3.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg4.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg5.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg6.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg7.png'
        ];

        let allBooks = [];
        let currentYearBooks = [];
        let currentIdx = -1;

        async function init() {
            try {
                const response = await fetch('books.json');
                const data = await response.json();
                allBooks = data.reverse(); 
                renderBookshelf();
                enableDragScroll();
            } catch (e) { console.error("Load Error"); }
        }

        function renderBookshelf() {
            const container = document.getElementById('main-bookshelf');
            container.innerHTML = '';
            const years = [...new Set(allBooks.map(b => b.year))].sort((a, b) => b - a);

            years.forEach(year => {
                const yearBooks = allBooks.filter(b => b.year === year);
                const section = document.createElement('div');
                section.innerHTML = `
                    <div class="year-label">
                        ${year} COLLECTION <span class="book-count">(${yearBooks.length} BOOKS)</span>
                    </div>
                    <div class="shelf">
                        <div class="books-row" id="shelf-${year}"></div>
                        <div class="shelf-board"></div>
                    </div>
                `;
                mainContainer.appendChild(section);

                const row = document.getElementById(`shelf-${year}`);
                yearBooks.forEach((book, index) => {
                    const bookEl = document.createElement('div');
                    bookEl.className = 'book';
                    const bg = bookBackgrounds[Math.floor(Math.random() * bookBackgrounds.length)];
                    const h = 200 + Math.floor(Math.random() * 40);
                    const w = book.title.length > 8 ? 85 : 58;
                    
                    bookEl.style.backgroundImage = `url('${bg}')`;
                    bookEl.style.height = `${h}px`;
                    bookEl.style.width = `${w}px`;
                    
                    bookEl.innerHTML = `<div class="spine-text">${book.title}</div>`;
                    bookEl.onclick = () => openModal(yearBooks, index);
                    row.appendChild(bookEl);
                });
            });
        }

        function openModal(booksArray, index) {
            currentYearBooks = booksArray;
            currentIdx = index;
            updateModalContent();
            document.getElementById('book-modal').style.display = "block";
        }

        function updateModalContent() {
            const book = currentYearBooks[currentIdx];
            document.getElementById('m-title').innerText = book.title;
            document.getElementById('m-author').innerText = book.author;
            document.getElementById('m-rating').innerText = book.rating;
            document.getElementById('m-date').innerText = `Catalogued: ${book.year}`;
            const img = document.getElementById('m-cover');
            img.src = book.cover || '';
            img.style.display = book.cover ? 'block' : 'none';

            let thoughts = "No entries.", highlights = "";
            if (book.note) {
                const parts = book.note.split('【劃線金句】');
                thoughts = parts[0].replace('【我的心得】', '').trim();
                highlights = parts[1] ? parts[1].trim() : "";
            }

            const hContainer = document.getElementById('m-highlights');
            hContainer.innerHTML = '';
            if (highlights) {
                highlights.split(/\n\s*\n/).forEach(text => {
                    const div = document.createElement('div');
                    div.className = 'highlight-item';
                    div.innerText = text.trim();
                    hContainer.appendChild(div);
                });
            }
            document.getElementById('m-thoughts').innerText = thoughts;

            // 控制按鈕可見度
            document.querySelector('.prev-btn').style.visibility = (currentIdx > 0) ? 'visible' : 'hidden';
            document.querySelector('.next-btn').style.visibility = (currentIdx < currentYearBooks.length - 1) ? 'visible' : 'hidden';
        }

        function changeBook(step) {
            const newIdx = currentIdx + step;
            if (newIdx >= 0 && newIdx < currentYearBooks.length) {
                currentIdx = newIdx;
                updateModalContent();
            }
        }

        function enableDragScroll() {
            const sliders = document.querySelectorAll('.books-row');
            sliders.forEach(slider => {
                let isDown = false, startX, scrollLeft;
                slider.addEventListener('mousedown', (e) => {
                    isDown = true;
                    startX = e.pageX - slider.offsetLeft;
                    scrollLeft = slider.scrollLeft;
                });
                slider.addEventListener('touchstart', (e) => {
                    isDown = true;
                    startX = e.touches[0].pageX - slider.offsetLeft;
                    scrollLeft = slider.scrollLeft;
                }, {passive: true});
                
                slider.addEventListener('mouseleave', () => isDown = false);
                slider.addEventListener('mouseup', () => isDown = false);
                slider.addEventListener('touchend', () => isDown = false);
                
                slider.addEventListener('mousemove', (e) => {
                    if (!isDown) return;
                    e.preventDefault();
                    const x = e.pageX - slider.offsetLeft;
                    slider.scrollLeft = scrollLeft - (x - startX) * 2;
                });
                slider.addEventListener('touchmove', (e) => {
                    if (!isDown) return;
                    const x = e.touches[0].pageX - slider.offsetLeft;
                    slider.scrollLeft = scrollLeft - (x - startX) * 1.5;
                }, {passive: true});
            });
        }

        function closeModal() { document.getElementById('book-modal').style.display = "none"; }
        window.onclick = (e) => { if (e.target.className === 'modal') closeModal(); }
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('book-modal').style.display === "block") {
                if (e.key === "ArrowLeft") changeBook(-1);
                if (e.key === "ArrowRight") changeBook(1);
                if (e.key === "Escape") closeModal();
            }
        });

        init();
    </script>
</body>
</html>
