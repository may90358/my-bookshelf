<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的私人典藏館 | Classical Archive</title>
    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #f9e29c;
            --gold-dark: #a67c00;
            --shelf-wood: #2b1d1a;
        }

        body {
            margin: 0;
            padding: 0;
            /* 背景圖：建議更換為你截圖中那種深色木質圖書館圖片 */
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), 
                        url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=2000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            font-family: "Times New Roman", "PingFang TC", "serif";
            color: white;
            min-height: 100vh;
        }

        h1 { 
            text-align: center;
            margin: 50px 0; 
            font-weight: bold; 
            letter-spacing: 8px; 
            text-shadow: 2px 2px 15px rgba(0,0,0,1);
            color: var(--gold-light);
        }

        /* 佈局結構 */
        .library-layout {
            display: flex;
            width: 100%;
            justify-content: center;
        }

        .side-view { flex: 1; opacity: 0.3; pointer-events: none; }

        .collection-center {
            flex: 2;
            max-width: 1100px;
            padding: 0 20px 100px;
            z-index: 5;
        }

        .year-label {
            font-size: 1.4rem;
            color: var(--gold-light);
            border-bottom: 2px solid var(--gold-dark);
            padding-bottom: 10px;
            margin: 50px 0 30px;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        /* 書架 */
        .shelf { position: relative; margin-bottom: 90px; }
        
        .books-row {
            display: flex;
            align-items: flex-end;
            padding: 0 10px 5px;
            gap: 3px;
            height: 250px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .books-row::-webkit-scrollbar { display: none; }

        /* [核心修改] 古典精裝書脊樣式 */
        .book {
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
            flex-shrink: 0;
            /* 書背圓潤弧度感 */
            border-radius: 4px 10px 10px 4px;
            /* 外陰影與模擬精裝凹槽的內陰影 */
            box-shadow: 
                inset 5px 0 10px rgba(0,0,0,0.5),
                inset -3px 0 8px rgba(0,0,0,0.3),
                5px 5px 15px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            box-sizing: border-box;
        }

        /* 燙金邊框效果 */
        .book::after {
            content: "";
            position: absolute;
            top: 8px; bottom: 8px; left: 6px; right: 6px;
            border: 1px solid var(--gold);
            opacity: 0.6;
            border-radius: 2px;
            pointer-events: none;
        }

        .book:hover {
            transform: translateY(-30px) scale(1.03);
            z-index: 50;
            box-shadow: 0 20px 40px rgba(0,0,0,0.9);
        }

        /* 書脊上的裝飾性橫線 (燙金線) */
        .decoration-line {
            width: 70%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold-light), transparent);
            margin: 5px 0;
        }

        .spine-text {
            writing-mode: vertical-rl;
            color: var(--gold-light);
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 0;
        }

        /* 木頭層板 */
        .shelf-board {
            height: 30px;
            background: linear-gradient(to bottom, #4e342e, #211613);
            width: 100%;
            border-radius: 2px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            border-top: 2px solid rgba(255,255,255,0.15);
        }

        /* 彈窗樣式 (維持精裝書質感) */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); }
        .modal-content { margin: 5vh auto; width: 90%; max-width: 1100px; position: relative; }
        .open-book { display: flex; background-color: #fff; box-shadow: 0 40px 100px rgba(0,0,0,0.8); height: 85vh; border-radius: 4px; overflow: hidden; }
        .page { flex: 1; padding: 40px; overflow-y: auto; color: #2c3e50; }
        .page.left { background: #fafafa; border-right: 1px solid #ddd; }
        .book-spine-crease { width: 20px; background: linear-gradient(to right, #ccc, #eee 50%, #ccc); flex-shrink: 0; }
        .highlight-item { background: #f9f9f9; padding: 15px; margin-bottom: 12px; color: #444; line-height: 1.8; font-size: 0.95rem; }
        .close-btn { position: absolute; right: -50px; top: -10px; font-size: 50px; color: white; cursor: pointer; }

        @media (max-width: 800px) {
            .side-view { display: none; }
            .collection-center { flex: 1; padding: 20px; }
        }
    </style>
</head>
<body>

    <h1>CURATED COLLECTION</h1>

    <div class="library-layout">
        <div class="side-view"></div>
        <div class="collection-center" id="main-bookshelf"></div>
        <div class="side-view"></div>
    </div>

    <div id="note-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="open-book">
                <div class="page left">
                    <div style="display: flex; gap: 20px; margin-bottom: 30px;">
                        <img id="modal-cover-img" style="width: 120px; border-radius: 4px; box-shadow: 0 5px 15px rgba(0,0,0,0.2);" src="" alt="">
                        <div>
                            <h2 id="modal-title" style="margin: 0 0 10px 0; font-family: serif;"></h2>
                            <div id="modal-author" style="color: #666; font-style: italic;"></div>
                            <div id="modal-rating" style="color: #f1c40f; margin: 10px 0;"></div>
                            <div id="modal-date" style="font-size: 0.8rem; border: 1px solid #ddd; padding: 3px 10px; border-radius: 4px;"></div>
                        </div>
                    </div>
                    <div id="modal-highlights"></div>
                </div>
                <div class="book-spine-crease"></div>
                <div class="page right">
                    <div style="font-size: 0.8rem; color: #a67c00; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #eee; letter-spacing: 2px;">ARCHIVE REFLECTIONS</div>
                    <div id="modal-thoughts" style="line-height: 2; color: #333; white-space: pre-wrap; font-size: 1.05rem;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function init() {
            try {
                const response = await fetch('books.json');
                const data = await response.json();
                data.sort((a, b) => b.year - a.year); 
                renderBookshelf(data);
            } catch (e) { console.error("Error loading shelf data"); }
        }

        function renderBookshelf(data) {
            const mainContainer = document.getElementById('main-bookshelf');
            mainContainer.innerHTML = '';
            const years = [...new Set(data.map(b => b.year))].sort((a, b) => b - a);

            years.forEach(year => {
                const section = document.createElement('div');
                section.innerHTML = `
                    <div class="year-label">${year} Archive</div>
                    <div class="shelf">
                        <div class="books-row" id="shelf-${year}"></div>
                        <div class="shelf-board"></div>
                    </div>
                `;
                mainContainer.appendChild(section);

                const row = document.getElementById(`shelf-${year}`);
                data.filter(b => b.year === year).forEach(book => {
                    const bookEl = document.createElement('div');
                    bookEl.className = 'book';
                    
                    // 根據書名長度動態調整高度與寬度，讓視覺不呆板
                    const height = 190 + Math.floor(Math.random() * 30);
                    const width = book.title.length > 7 ? 75 : 55;
                    
                    bookEl.style.backgroundColor = book.color || '#2c3e50';
                    bookEl.style.height = `${height}px`;
                    bookEl.style.width = `${width}px`;
                    
                    // 添加古典裝飾線與燙金文字
                    bookEl.innerHTML = `
                        <div class="decoration-line"></div>
                        <div class="decoration-line" style="width: 40%"></div>
                        <div class="spine-text">${book.title}</div>
                        <div class="decoration-line" style="width: 40%"></div>
                        <div class="decoration-line"></div>
                    `;
                    
                    bookEl.onclick = () => openNote(book);
                    row.appendChild(bookEl);
                });
            });
        }

        function openNote(book) {
            document.getElementById('modal-title').innerText = book.title;
            document.getElementById('modal-author').innerText = book.author;
            document.getElementById('modal-rating').innerText = book.rating;
            document.getElementById('modal-date').innerText = `Completed: ${book.year}`;
            const coverImg = document.getElementById('modal-cover-img');
            coverImg.src = book.cover || '';
            coverImg.style.display = book.cover ? 'block' : 'none';

            let thoughts = "No reflections recorded.", rawHighlights = "";
            if (book.note) {
                const parts = book.note.split('【劃線金句】');
                thoughts = parts[0].replace('【我的心得】', '').trim();
                rawHighlights = parts[1] ? parts[1].trim() : "";
            }

            const hContainer = document.getElementById('modal-highlights');
            hContainer.innerHTML = '';
            if (rawHighlights) {
                rawHighlights.split(/\n\s*\n/).forEach(text => {
                    const item = document.createElement('div');
                    item.className = 'highlight-item';
                    item.innerText = text.trim();
                    hContainer.appendChild(item);
                });
            }
            document.getElementById('modal-thoughts').innerText = thoughts;
            document.getElementById('note-modal').style.display = "block";
        }

        function closeModal() { document.getElementById('note-modal').style.display = "none"; }
        window.onclick = (e) => { if (e.target.className === 'modal') closeModal(); }
        init();
    </script>
</body>
</html>
