<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的私人典藏館 | Luxury Archive</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --gold-bright: #ffd700;
            --gold-text: #eec16d;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=2000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            font-family: "Georgia", "PingFang TC", "serif";
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 { 
            text-align: center;
            margin: 40px 0; 
            font-weight: bold; 
            letter-spacing: 8px; 
            text-shadow: 0 5px 15px rgba(0,0,0,0.8);
            color: var(--gold-text);
            font-size: 1.8rem;
        }

        .collection-center {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 100px;
        }

        .year-label {
            font-size: 1.3rem;
            color: var(--gold-bright);
            border-bottom: 2px solid rgba(255, 215, 0, 0.4);
            padding-bottom: 8px;
            margin: 50px 0 20px;
            letter-spacing: 3px;
            font-weight: bold;
            display: flex;
            align-items: baseline;
        }

        .shelf { position: relative; margin-bottom: 60px; }
        
        .books-row {
            display: flex;
            align-items: flex-end;
            padding: 0 5px 5px;
            gap: 2px; 
            height: 280px;
            overflow-x: auto;
            scrollbar-width: none;
            cursor: grab;
        }
        .books-row::-webkit-scrollbar { display: none; }

        .book {
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            flex-shrink: 0;
            border-radius: 2px 4px 4px 2px;
            background-size: 100% 100%;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .book:hover { transform: translateY(-20px); z-index: 10; filter: brightness(1.1); }

        .spine-text {
            writing-mode: vertical-rl; 
            direction: ltr;           
            color: #fcf4d9;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
            padding: 10px 0;
            text-align: center;
            pointer-events: none;
            word-break: break-all;
            max-height: 134px; 
            display: flex;
            flex-direction: row; 
            justify-content: center;
        }

        .shelf-board {
            height: 20px;
            background: linear-gradient(to bottom, #4e342e, #1a0f0d);
            width: 100%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
        }

        /* --- 彈窗樣式 --- */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); backdrop-filter: blur(8px); }
        .modal-container {
            position: relative;
            width: 95%;
            max-width: 900px;
            height: 90vh;
            margin: 5vh auto;
            display: flex;
            flex-direction: column;
            background-color: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .close-btn { position: absolute; right: 15px; top: 10px; font-size: 35px; color: #333; cursor: pointer; z-index: 2100; line-height: 1; }

        .open-book { display: flex; flex: 1; overflow-y: auto; scrollbar-width: none; background: #fafafa; }
        .open-book::-webkit-scrollbar { display: none; }
        
        .page { flex: 1; padding: 30px; color: #333; background: #fafafa; }
        .page.left { background: #fafafa; border-right: 1px solid #eee; }
        .book-spine-crease { width: 1px; background: linear-gradient(to right, #ddd, #fff 50%, #ddd); flex-shrink: 0; }
        
        /* 書封固定高度 */
        #m-cover { height: 140px; width: auto; object-fit: contain; border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        .modal-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: #f1f1f1;
            border-top: 1px solid #ddd;
        }

        .nav-btn { background: #333; color: var(--gold-bright); border: none; padding: 8px 18px; border-radius: 20px; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .highlight-item { background: #fdfaf5; padding: 12px; margin-bottom: 12px; border-left: 4px solid var(--gold-bright); color: #444; line-height: 1.6; font-size: 0.9rem; }

        @media (max-width: 800px) {
            h1 { font-size: 1.4rem; margin: 25px 0; }
            .modal-container { height: 92vh; margin: 4vh auto; width: 92%; }
            .open-book { flex-direction: column; }
            .page { width: 100%; flex: none; padding: 25px; box-sizing: border-box; }
            .page.left { border-right: none; border-bottom: 1px solid #eee; }
            .book-spine-crease { width: 100%; height: 10px; background: linear-gradient(to bottom, #ddd, #fff 50%, #ddd); }
            #m-cover { height: 120px !important; }
        }
    </style>
</head>
<body>

    <h1>PRIVATE LIBRARY</h1>

    <div class="collection-center" id="main-bookshelf"></div>

    <div id="book-modal" class="modal">
        <div class="modal-container">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="open-book">
                <div class="page left">
                    <div style="display: flex; gap: 15px; margin-bottom: 20px; align-items: flex-start;">
                        <img id="m-cover" src="" alt="Cover">
                        <div style="flex: 1;">
                            <h2 id="m-title" style="margin: 0 0 5px 0; font-family: serif; color: #1a1a1a;"></h2>
                            <div id="m-author" style="color: #666; font-size: 0.9rem;"></div>
                            <div id="m-rating" style="color: #d4af37; margin: 8px 0; font-size: 1rem;"></div>
                            <div id="m-date" style="font-size: 0.75rem; background: #f0f0f0; padding: 4px 10px; border-radius: 4px; display: inline-block; color: #555; border: 1px solid #ddd;"></div>
                        </div>
                    </div>
                    <div id="m-highlights"></div>
                </div>
                <div class="book-spine-crease"></div>
                <div class="page">
                    <div style="font-size: 0.75rem; color: #b8860b; font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; letter-spacing: 1px;">REFLECTIONS</div>
                    <div id="m-thoughts" style="line-height: 1.8; white-space: pre-wrap; font-size: 0.95rem; color: #333;"></div>
                </div>
            </div>
            <div class="modal-nav">
                <button class="nav-btn prev-btn" onclick="changeBook(-1)"><i class="fas fa-chevron-left"></i> 上一本</button>
                <button class="nav-btn next-btn" onclick="changeBook(1)">下一本 <i class="fas fa-chevron-right"></i></button>
            </div>
        </div>
    </div>

    <script>
        const bookBackgrounds = [
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg1.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg2.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg3.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg4.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg5.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg6.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg7.png'
        ];

        let allBooks = [];
        let currentYearBooks = [];
        let currentIdx = -1;

        async function init() {
    try {
        const response = await fetch('books.json');
        const data = await response.json();
        
        // 1. 統一將資料存入 allBooks，不再預設 reverse
        allBooks = data; 
        
        renderBookshelf();
        enableDragScroll();
    } catch (e) { 
        console.error("Load Error", e); 
    }
}

        function renderBookshelf() {
    const container = document.getElementById('main-bookshelf');
    container.innerHTML = '';
    
    // 2. 取得所有年份並由大到小排序 (2026 -> 2025)
    const years = [...new Set(allBooks.map(b => b.year))].sort((a, b) => b - a);

    years.forEach(year => {
        // 3. 過濾該年份書籍，並針對日期進行排序 (由新到舊)
        const yearBooks = allBooks
            .filter(b => b.year === year)
            .sort((a, b) => {
                const dateA = new Date(a["Date Finished"] || a.date || a.year);
                const dateB = new Date(b["Date Finished"] || b.date || b.year);
                return dateB - dateA; // 新的在前
            });

        const section = document.createElement('div');
        section.innerHTML = `
            <div class="year-label">
                ${year} COLLECTION 
                <span class="book-count">(${yearBooks.length} BOOKS)</span>
            </div>
            <div class="shelf">
                <div class="books-row" id="shelf-${year}"></div>
                <div class="shelf-board"></div>
            </div>
        `;
        container.appendChild(section);

        const row = document.getElementById(`shelf-${year}`);
        yearBooks.forEach((book, index) => {
            const bookEl = document.createElement('div');
            bookEl.className = 'book';
            
            // 隨機外觀邏輯保持不變
            const bg = bookBackgrounds[Math.floor(Math.random() * bookBackgrounds.length)];
            const h = 210 + Math.floor(Math.random() * 30);
            const w = book.title.length > 8 ? 85 : 58;
            
            bookEl.style.backgroundImage = `url('${bg}')`;
            bookEl.style.height = `${h}px`;
            bookEl.style.width = `${w}px`;
            bookEl.innerHTML = `<div class="spine-text">${book.title}</div>`;
            
            // 點擊時開啟該排序後的陣列
            bookEl.onclick = () => openModal(yearBooks, index);
            row.appendChild(bookEl);
        });
    });
}

        function openModal(booksArray, index) {
            currentYearBooks = booksArray;
            currentIdx = index;
            updateModalContent();
            document.getElementById('book-modal').style.display = "block";
            document.body.style.overflow = 'hidden'; 
        }

        function updateModalContent() {
            const book = currentYearBooks[currentIdx];
            document.getElementById('m-title').innerText = book.title;
            document.getElementById('m-author').innerText = book.author;
            document.getElementById('m-rating').innerText = book.rating;
            
            // Notion 日期讀取
            const finishedDate = book["Date Finished"] || book.date || book.year;
            document.getElementById('m-date').innerText = `Finished: ${finishedDate}`;
            
            const img = document.getElementById('m-cover');
            img.src = book.cover || '';
            img.style.display = book.cover ? 'block' : 'none';

            let thoughts = "No reflections available.", highlights = "";
            if (book.note) {
                const parts = book.note.split('【劃線金句】');
                thoughts = parts[0].replace('【我的心得】', '').trim();
                highlights = parts[1] ? parts[1].trim() : "";
            }

            const hContainer = document.getElementById('m-highlights');
            hContainer.innerHTML = '';
            if (highlights) {
                highlights.split(/\n\s*\n/).forEach(text => {
                    if(text.trim()){
                        const div = document.createElement('div');
                        div.className = 'highlight-item';
                        div.innerText = text.trim();
                        hContainer.appendChild(div);
                    }
                });
            }
            document.getElementById('m-thoughts').innerText = thoughts;

            document.querySelector('.prev-btn').disabled = (currentIdx === 0);
            document.querySelector('.next-btn').disabled = (currentIdx === currentYearBooks.length - 1);
        }

        function changeBook(step) {
            const newIdx = currentIdx + step;
            if (newIdx >= 0 && newIdx < currentYearBooks.length) {
                currentIdx = newIdx;
                updateModalContent();
            }
        }

        function closeModal() { 
            document.getElementById('book-modal').style.display = "none"; 
            document.body.style.overflow = 'auto';
        }

        function enableDragScroll() {
            const sliders = document.querySelectorAll('.books-row');
            sliders.forEach(slider => {
                let isDown = false, startX, scrollLeft;
                slider.addEventListener('mousedown', (e) => {
                    isDown = true; startX = e.pageX - slider.offsetLeft; scrollLeft = slider.scrollLeft;
                });
                slider.addEventListener('mouseleave', () => isDown = false);
                slider.addEventListener('mouseup', () => isDown = false);
                slider.addEventListener('mousemove', (e) => {
                    if (!isDown) return;
                    e.preventDefault();
                    const x = e.pageX - slider.offsetLeft;
                    slider.scrollLeft = scrollLeft - (x - startX) * 2;
                });
            });
        }
        
        window.onclick = (e) => { if (e.target.className === 'modal') closeModal(); }
        init();
    </script>
</body>
</html>
