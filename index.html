<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的私人典藏館 | Classical Archive</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --gold-bright: #ffd700;
            --gold-text: #eec16d;
        }

        body {
            margin: 0;
            padding: 0;
            /* 融合背景：使用深色漸層疊加在古典書架圖片上 */
            background: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.6)), 
                        url('https://raw.githubusercontent.com/may90358/my-bookshelf/main/images/13817480366721164416.jpeg') no-repeat center center fixed;
            background-size: cover;
            font-family: "Georgia", "PingFang TC", "serif";
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 { 
            text-align: center;
            margin: 60px 0 20px; 
            font-weight: bold; 
            letter-spacing: 10px; 
            text-shadow: 0 5px 20px rgba(0,0,0,1);
            color: var(--gold-text);
            font-size: 2.2rem;
            font-variant: small-caps;
        }

        .collection-center {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 100px;
        }

        .year-label {
            font-size: 1.3rem;
            color: var(--gold-bright);
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
            padding-bottom: 8px;
            margin: 50px 0 20px;
            letter-spacing: 3px;
            font-weight: bold;
            display: flex;
            align-items: baseline;
        }

        .book-count {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
            margin-left: 12px;
            font-weight: normal;
        }

        .shelf { position: relative; margin-bottom: 60px; }
        
        .books-row {
            display: flex;
            align-items: flex-end;
            padding: 0 5px 15px;
            gap: 3px; 
            height: 280px;
            overflow-x: auto;
            scrollbar-width: none;
            cursor: grab;
        }
        .books-row::-webkit-scrollbar { display: none; }

        .book {
            cursor: pointer;
            transition: transform 0.4s ease, filter 0.4s ease;
            position: relative;
            flex-shrink: 0;
            border-radius: 2px 4px 4px 2px;
            background-size: 100% 100%;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .book:hover { 
            transform: translateY(-15px) scale(1.05); 
            z-index: 10; 
            filter: brightness(1.2); 
        }

        .spine-text {
            writing-mode: vertical-rl; 
            color: #fcf4d9;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            padding: 10px 0;
            text-align: center;
            pointer-events: none;
        }

        .shelf-board {
            height: 25px;
            background: linear-gradient(to bottom, #3d2b1f, #1a0f0d);
            width: 100%;
            box-shadow: 0 10px 20px rgba(0,0,0,0.8);
            border-radius: 2px;
        }

        /* --- 彈窗樣式 (高度同步修正版) --- */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); }
        .modal-container {
            position: relative;
            width: 95%;
            max-width: 950px;
            height: 85vh;
            margin: 7vh auto;
            display: flex;
            flex-direction: column;
            background-color: #fff;
            border-radius: 4px;
            overflow: hidden;
        }

        .close-btn { position: absolute; right: 15px; top: 10px; font-size: 30px; color: #333; cursor: pointer; z-index: 2100; }

        .open-book { 
            display: flex; 
            flex: 1; 
            overflow-y: auto; 
            scrollbar-width: none; 
            align-items: stretch; /* 強制左右等高 */
            background-color: #fff;
        }
        .open-book::-webkit-scrollbar { display: none; }
        
        .page { 
            flex: 1; 
            padding: 50px 40px; 
            color: #333; 
            display: flex;
            flex-direction: column;
        }
        .page.left { background: #f9f9f9; border-right: 1px solid #eee; }
        
        .book-spine-crease { 
            width: 18px; 
            background: linear-gradient(to right, #ccc, #fff 50%, #ccc); 
            flex-shrink: 0;
        }
        
        #m-cover { height: 160px; width: auto; object-fit: contain; border-radius: 3px; box-shadow: 0 5px 15px rgba(0,0,0,0.15); }

        .modal-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: #eee;
            border-top: 1px solid #ddd;
        }

        .nav-btn { background: #222; color: var(--gold-bright); border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
        .nav-btn:disabled { opacity: 0.3; }

        .highlight-item { background: #fdfaf5; padding: 15px; margin-bottom: 15px; border-left: 5px solid var(--gold-bright); color: #444; line-height: 1.8; }

        @media (max-width: 800px) {
            .open-book { flex-direction: column; }
            .page { width: 100%; padding: 30px; }
            .book-spine-crease { width: 100%; height: 15px; background: linear-gradient(to bottom, #ccc, #fff 50%, #ccc); }
        }
    </style>
</head>
<body>

    <h1>Private Collection</h1>

    <div class="collection-center" id="main-bookshelf"></div>

    <div id="book-modal" class="modal">
        <div class="modal-container">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="open-book">
                <div class="page left">
                    <div style="display: flex; gap: 20px; margin-bottom: 30px;">
                        <img id="m-cover" src="" alt="Cover">
                        <div style="flex: 1;">
                            <h2 id="m-title" style="margin: 0 0 10px 0; font-family: serif; color: #111;"></h2>
                            <div id="m-author" style="color: #555;"></div>
                            <div id="m-rating" style="color: #b8860b; margin: 10px 0;"></div>
                            <div id="m-date" style="font-size: 0.8rem; color: #777;"></div>
                        </div>
                    </div>
                    <div id="m-highlights"></div>
                </div>
                <div class="book-spine-crease"></div>
                <div class="page right">
                    <div style="font-size: 0.8rem; color: #999; font-weight: bold; margin-bottom: 15px; letter-spacing: 2px; border-bottom: 1px solid #eee; padding-bottom: 5px;">THOUGHTS</div>
                    <div id="m-thoughts" style="line-height: 2; white-space: pre-wrap; font-size: 1rem;"></div>
                </div>
            </div>
            <div class="modal-nav">
                <button class="nav-btn prev-btn" onclick="changeBook(-1)"><i class="fas fa-arrow-left"></i> Previous</button>
                <button class="nav-btn next-btn" onclick="changeBook(1)">Next <i class="fas fa-arrow-right"></i></button>
            </div>
        </div>
    </div>

    <script>
        const bookBackgrounds = [
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg1.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg2.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg3.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg4.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg5.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg6.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg7.png'
        ];

        let allBooks = [];
        let currentYearBooks = [];
        let currentIdx = -1;

        async function init() {
            try {
                const response = await fetch('books.json');
                const data = await response.json();
                // 排序邏輯：將資料反轉，讓最近讀完的書排在數組前面（左邊）
                allBooks = data.reverse(); 
                renderBookshelf();
            } catch (e) { console.error("Load Error"); }
        }

        function renderBookshelf() {
            const container = document.getElementById('main-bookshelf');
            container.innerHTML = '';
            // 取得所有年份並由大到小排（最新的年份在上面）
            const years = [...new Set(allBooks.map(b => b.year))].sort((a, b) => b - a);

            years.forEach(year => {
                const yearBooks = allBooks.filter(b => b.year === year);
                const section = document.createElement('div');
                section.innerHTML = `
                    <div class="year-label">${year} COLLECTION <span class="book-count">(${yearBooks.length} BOOKS)</span></div>
                    <div class="shelf">
                        <div class="books-row" id="shelf-${year}"></div>
                        <div class="shelf-board"></div>
                    </div>
                `;
                container.appendChild(section);

                const row = document.getElementById(`shelf-${year}`);
                yearBooks.forEach((book, index) => {
                    const bookEl = document.createElement('div');
                    bookEl.className = 'book';
                    const bg = bookBackgrounds[Math.floor(Math.random() * bookBackgrounds.length)];
                    const h = 210 + (Math.random() * 30);
                    const w = book.title.length > 8 ? 80 : 60;
                    bookEl.style.backgroundImage = `url('${bg}')`;
                    bookEl.style.height = `${h}px`;
                    bookEl.style.width = `${w}px`;
                    bookEl.innerHTML = `<div class="spine-text">${book.title}</div>`;
                    bookEl.onclick = () => openModal(yearBooks, index);
                    row.appendChild(bookEl);
                });
            });
        }

        function openModal(booksArray, index) {
            currentYearBooks = booksArray;
            currentIdx = index;
            updateModalContent();
            document.getElementById('book-modal').style.display = "block";
            document.body.style.overflow = 'hidden';
        }

        function updateModalContent() {
            const book = currentYearBooks[currentIdx];
            document.getElementById('m-title').innerText = book.title;
            document.getElementById('m-author').innerText = book.author;
            document.getElementById('m-rating').innerText = book.rating;
            document.getElementById('m-date').innerText = `Finished: ${book["Date Finished"] || book.year}`;
            
            const img = document.getElementById('m-cover');
            img.src = book.cover || '';
            img.style.display = book.cover ? 'block' : 'none';

            let thoughts = "", highlights = "";
            if (book.note) {
                const parts = book.note.split('【劃線金句】');
                thoughts = parts[0].replace('【我的心得】', '').trim();
                highlights = parts[1] ? parts[1].trim() : "";
            }

            const hContainer = document.getElementById('m-highlights');
            hContainer.innerHTML = '';
            if (highlights) {
                highlights.split(/\n\s*\n/).forEach(text => {
                    const div = document.createElement('div');
                    div.className = 'highlight-item';
                    div.innerText = text.trim();
                    hContainer.appendChild(div);
                });
            }
            document.getElementById('m-thoughts').innerText = thoughts || "No reflections shared yet.";

            document.querySelector('.prev-btn').disabled = (currentIdx === 0);
            document.querySelector('.next-btn').disabled = (currentIdx === currentYearBooks.length - 1);
            document.querySelector('.open-book').scrollTop = 0;
        }

        function changeBook(step) {
            currentIdx += step;
            updateModalContent();
        }

        function closeModal() { 
            document.getElementById('book-modal').style.display = "none"; 
            document.body.style.overflow = 'auto';
        }

        window.onclick = (e) => { if (e.target.className === 'modal') closeModal(); }
        init();
    </script>
</body>
</html>
