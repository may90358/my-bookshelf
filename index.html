<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的互動書櫃 | Notion 精裝版</title>
    <style>
        :root {
            --shelf-color: #5d4037;
            --shelf-depth: #3e2723;
            --wall-color: #f4f1ea;
            --paper-color: #fafafa;
            --ink-color: #2c3e50;
            --accent-color: #8d6e63;
        }

        body {
            background-color: var(--wall-color);
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            margin: 0;
            padding-bottom: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        h1 { margin: 60px 0 20px; color: #2c3e50; font-weight: 300; letter-spacing: 2px; }

        /* --- 書架顯示區 --- */
        .bookshelf-container { width: 95%; max-width: 1100px; }
        .year-section { margin-top: 50px; }
        .year-label { font-size: 1.4rem; font-weight: bold; color: var(--accent-color); margin-bottom: 12px; border-left: 5px solid var(--shelf-color); padding-left: 15px; }
        .shelf { position: relative; margin-bottom: 50px; }
        
        .books-row { 
            display: flex; align-items: flex-end; padding: 0 20px 15px 20px; gap: 6px; height: 240px; 
            z-index: 2; position: relative; overflow-x: auto; cursor: grab; scrollbar-width: none; 
            -ms-overflow-style: none; user-select: none;
        }
        .books-row::-webkit-scrollbar { display: none; }
        .books-row:active { cursor: grabbing; }

        .book { 
            cursor: pointer; transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); 
            display: flex; align-items: center; justify-content: center; position: relative; 
            box-shadow: 2px 0 5px rgba(0,0,0,0.3); border-radius: 2px 4px 4px 2px; 
            border-left: 2px solid rgba(255,255,255,0.1); flex-shrink: 0; 
        }
        .book:hover { transform: translateY(-20px); z-index: 10; }
        .spine-text { writing-mode: vertical-rl; color: white; font-size: 14px; padding: 10px 0; font-style: normal; pointer-events: none; white-space: nowrap; }
        .shelf-board { height: 20px; background: linear-gradient(to bottom, var(--shelf-color), var(--shelf-depth)); width: 100%; border-radius: 4px; box-shadow: 0 8px 15px rgba(0,0,0,0.3); }

        /* --- 彈窗 UI --- */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); backdrop-filter: blur(5px); perspective: 2000px; }
        .modal-content { margin: 5vh auto; width: 90%; max-width: 1100px; position: relative; }
        
        .open-book { 
            display: flex; background-color: #fff; border-bottom: 8px solid #bbb; border-right: 5px solid #bbb; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.5); border-radius: 4px; transform: rotateX(5deg); 
            transform-style: preserve-3d; height: 85vh; overflow: hidden; 
        }

        .page { flex: 1; padding: 40px; overflow-y: auto; color: var(--ink-color); display: flex; flex-direction: column; scrollbar-width: none; }
        .page::-webkit-scrollbar { display: none; }
        .page.left { background-image: linear-gradient(to right, #fafafa 95%, #e0e0e0 100%); border-right: 1px solid rgba(0,0,0,0.05); }
        .page.right { background-image: linear-gradient(to left, #ffffff 95%, #e0e0e0 100%); }
        .book-spine-crease { width: 15px; background: linear-gradient(to right, #dcdcdc, #ffffff 50%, #dcdcdc); flex-shrink: 0; z-index: 5; }

        /* 左頁排版：圖片在左，資訊在右 */
        .left-page-header { display: flex; align-items: flex-start; gap: 25px; margin-bottom: 30px; }
        .book-cover-small { width: 130px; height: auto; border-radius: 4px; box-shadow: 0 5px 15px rgba(0,0,0,0.15); flex-shrink: 0; }
        .book-info-text { display: flex; flex-direction: column; }
        .modal-title { font-size: 1.5rem; margin: 0 0 10px 0; font-weight: bold; color: #1a1a1a; }
        .modal-author { font-size: 1rem; color: #555; margin-bottom: 8px; }
        .modal-rating { font-size: 1.1rem; color: #f1c40f; margin-bottom: 12px; }
        .modal-date { font-size: 0.8rem; color: #888; background: #eee; padding: 4px 12px; border-radius: 12px; width: fit-content; }

        /* 金句卡片容器 */
        .highlight-container { display: flex; flex-direction: column; gap: 15px; margin-top: 10px; }
        .highlight-item {
            line-height: 1.8; color: #444; background: rgba(0,0,0,0.04); 
            padding: 15px 20px; border-radius: 10px; font-size: 0.95rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .section-label { font-size: 0.85rem; color: var(--accent-color); font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #e0e0e0; padding-bottom: 6px; letter-spacing: 1.5px; }
        .thought-section { line-height: 2.1; font-size: 1.1rem; color: #2c3e50; white-space: pre-wrap; }
        .close-btn { position: absolute; right: -40px; top: -20px; font-size: 50px; cursor: pointer; color: #fff; z-index: 1001; }

        @media (max-width: 800px) {
            .left-page-header { flex-direction: column; align-items: center; text-align: center; }
            .open-book { flex-direction: column; height: 90vh; }
            .book-spine-crease { width: 100%; height: 10px; }
        }
    </style>
</head>
<body>

    <h1>My Reading Shelf</h1>
    <div class="bookshelf-container" id="main-bookshelf"></div>

    <div id="note-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="open-book">
                <div class="page left">
                    <div class="left-page-header">
                        <img id="modal-cover-img" class="book-cover-small" src="" alt="">
                        <div class="book-info-text">
                            <h2 id="modal-title" class="modal-title"></h2>
                            <div id="modal-author" class="modal-author"></div>
                            <div id="modal-rating" class="modal-rating"></div>
                            <div id="modal-date" class="modal-date"></div>
                        </div>
                    </div>
                    <div id="modal-highlights" class="highlight-container"></div>
                </div>

                <div class="book-spine-crease"></div>

                <div class="page right">
                    <span class="section-label">【 我 的 心 得 】</span>
                    <div id="modal-thoughts" class="thought-section"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function init() {
            try {
                const response = await fetch('books.json');
                const data = await response.json();
                data.sort((a, b) => b.year - a.year); 
                renderBookshelf(data);
                enableDragScroll();
            } catch (e) { console.error("Error loading books"); }
        }

        function renderBookshelf(data) {
            const mainContainer = document.getElementById('main-bookshelf');
            mainContainer.innerHTML = '';
            const years = [...new Set(data.map(b => b.year))].sort((a, b) => b - a);
            years.forEach(year => {
                const section = document.createElement('div');
                section.className = 'year-section';
                section.innerHTML = `<div class="year-label">${year} 年</div><div class="shelf"><div class="books-row" id="shelf-${year}"></div><div class="shelf-board"></div></div>`;
                mainContainer.appendChild(section);
                const row = document.getElementById(`shelf-${year}`);
                data.filter(b => b.year === year).forEach(book => {
                    const bookEl = document.createElement('div');
                    bookEl.className = 'book';
                    bookEl.style.backgroundColor = book.color || '#2c3e50';
                    bookEl.style.height = `${book.height || 200}px`;
                    bookEl.style.width = `${book.width || 40}px`;
                    bookEl.innerHTML = `<div class="spine-text">${book.title}</div>`;
                    bookEl.onclick = () => openNote(book);
                    row.appendChild(bookEl);
                });
            });
        }

        function enableDragScroll() {
            const sliders = document.querySelectorAll('.books-row');
            sliders.forEach(slider => {
                let isDown = false, startX, scrollLeft;
                slider.addEventListener('mousedown', (e) => { isDown = true; startX = e.pageX - slider.offsetLeft; scrollLeft = slider.scrollLeft; });
                slider.addEventListener('mouseleave', () => isDown = false);
                slider.addEventListener('mouseup', () => isDown = false);
                slider.addEventListener('mousemove', (e) => { if (!isDown) return; e.preventDefault(); const x = e.pageX - slider.offsetLeft; const walk = (x - startX) * 2; slider.scrollLeft = scrollLeft - walk; });
            });
        }

        function openNote(book) {
            document.getElementById('modal-title').innerText = book.title;
            document.getElementById('modal-author').innerText = book.author;
            document.getElementById('modal-rating').innerText = book.rating;
            document.getElementById('modal-date').innerText = `完讀：${book.year}`;
            
            const coverImg = document.getElementById('modal-cover-img');
            coverImg.src = book.cover || '';
            coverImg.style.display = book.cover ? 'block' : 'none';

            let thoughts = "尚無紀錄", rawHighlights = "";
            if (book.note) {
                const parts = book.note.split('【劃線金句】');
                thoughts = parts[0].replace('【我的心得】', '').trim() || "無紀錄";
                rawHighlights = parts[1] ? parts[1].trim() : "";
            }

            // --- 修正後的 Notion 區塊拆分邏輯 ---
            const highlightContainer = document.getElementById('modal-highlights');
            highlightContainer.innerHTML = '';
            
            if (rawHighlights) {
                // 使用正則表達式拆分，適應多個換行符號（Notion 區塊轉換常見現象）
                // 這樣可以確保「一個段落」就是「一個卡片」，而不是一行一個卡片
                const blocks = rawHighlights.split(/\n\s*\n/).filter(b => b.trim().length > 0);
                
                blocks.forEach(text => {
                    const item = document.createElement('div');
                    item.className = 'highlight-item';
                    item.innerText = text.trim();
                    highlightContainer.appendChild(item);
                });
            } else {
                highlightContainer.innerHTML = '<div class="highlight-item">尚無金句紀錄</div>';
            }

            document.getElementById('modal-thoughts').innerText = thoughts;
            document.getElementById('note-modal').style.display = "block";
        }

        function closeModal() { document.getElementById('note-modal').style.display = "none"; }
        window.onclick = (e) => { if (e.target.className === 'modal') closeModal(); }
        init();
    </script>
</body>
</html>
