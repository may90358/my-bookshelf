<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的私人典藏館 | Classical Archive</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --gold-bright: #ffd700;
            --gold-text: #eec16d;
        }

        body {
            margin: 0;
            padding: 0;
            /* 融合背景：使用深色漸層疊加在古典書架背景圖上 */
            background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.65)), 
                        url('https://raw.githubusercontent.com/may90358/my-bookshelf/main/images/13817480366721164416.jpeg') no-repeat center center fixed;
            background-size: cover;
            font-family: "Georgia", "PingFang TC", "serif";
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 { 
            text-align: center;
            margin: 60px 0 20px; 
            font-weight: bold; 
            letter-spacing: 10px; 
            text-shadow: 0 5px 25px rgba(0,0,0,1);
            color: var(--gold-text);
            font-size: 2.2rem;
            font-variant: small-caps;
        }

        .collection-center {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 100px;
        }

        .year-label {
            font-size: 1.3rem;
            color: var(--gold-bright);
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
            padding-bottom: 10px;
            margin: 60px 0 20px;
            letter-spacing: 3px;
            font-weight: bold;
            display: flex;
            align-items: baseline;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .book-count {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
            margin-left: 15px;
            font-weight: normal;
        }

        .shelf { position: relative; margin-bottom: 80px; }
        
        .books-row {
            display: flex;
            align-items: flex-end;
            padding: 0 10px 10px;
            gap: 4px; 
            height: 280px;
            overflow-x: auto;
            scrollbar-width: none;
            cursor: grab;
            /* 讓書籍稍微浮起，不完全貼死背景 */
            perspective: 1000px;
        }
        .books-row::-webkit-scrollbar { display: none; }

        .book {
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), filter 0.4s ease;
            position: relative;
            flex-shrink: 0;
            border-radius: 2px 4px 4px 2px;
            background-size: 100% 100%;
            box-shadow: 5px 8px 18px rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .book:hover { 
            transform: translateY(-25px) rotateY(-5deg) scale(1.08); 
            z-index: 10; 
            filter: brightness(1.2) contrast(1.1); 
        }

        .spine-text {
            writing-mode: vertical-rl; 
            color: #fcf4d9;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.9);
            padding: 12px 0;
            text-align: center;
            pointer-events: none;
            max-height: 80%;
            overflow: hidden;
        }

        .shelf-board {
            height: 28px;
            background: linear-gradient(to bottom, #3d2b1f, #1a0f0d 20%, #000);
            width: 100%;
            box-shadow: 0 12px 25px rgba(0,0,0,0.9);
            border-radius: 2px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        /* --- 彈窗樣式 --- */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); backdrop-filter: blur(12px); }
        .modal-container {
            position: relative;
            width: 95%;
            max-width: 1000px;
            height: 85vh;
            margin: 7vh auto;
            display: flex;
            flex-direction: column;
            background-color: #fff;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        .close-btn { position: absolute; right: 20px; top: 15px; font-size: 35px; color: #333; cursor: pointer; z-index: 2100; opacity: 0.6; transition: 0.3s; }
        .close-btn:hover { opacity: 1; }

        .open-book { 
            display: flex; 
            flex: 1; 
            overflow-y: auto; 
            scrollbar-width: none; 
            align-items: stretch;
            background-color: #fff;
        }
        .open-book::-webkit-scrollbar { display: none; }
        
        .page { 
            flex: 1; 
            padding: 50px 50px; 
            color: #333; 
            display: flex;
            flex-direction: column;
        }
        .page.left { background: #fdfdfd; border-right: 1px solid #eee; }
        
        .book-spine-crease { 
            width: 20px; 
            background: linear-gradient(to right, #ddd, #fff 50%, #ddd); 
            flex-shrink: 0;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }
        
        #m-cover { height: 180px; width: auto; object-fit: contain; border-radius: 3px; box-shadow: 0 10px 20px rgba(0,0,0,0.15); margin-bottom: 20px; }

        .modal-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: #f5f5f5;
            border-top: 1px solid #ddd;
        }

        .nav-btn { background: #222; color: var(--gold-bright); border: none; padding: 12px 25px; border-radius: 4px; cursor: pointer; font-family: serif; letter-spacing: 1px; transition: 0.3s; }
        .nav-btn:hover:not(:disabled) { background: #000; transform: translateY(-2px); }
        .nav-btn:disabled { opacity: 0.2; cursor: not-allowed; }

        .highlight-item { background: #fdfaf5; padding: 18px; margin-bottom: 15px; border-left: 5px solid var(--gold-bright); color: #444; line-height: 1.8; font-style: italic; }

        @media (max-width: 800px) {
            .open-book { flex-direction: column; }
            .page { width: 100%; padding: 30px; }
            .book-spine-crease { width: 100%; height: 15px; background: linear-gradient(to bottom, #ddd, #fff 50%, #ddd); }
        }
    </style>
</head>
<body>

    <h1>Private Library</h1>

    <div class="collection-center" id="main-bookshelf"></div>

    <!-- 彈窗內容保持不變 -->
    <div id="book-modal" class="modal">
        <div class="modal-container">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="open-book">
                <div class="page left">
                    <div style="display: flex; gap: 25px; margin-bottom: 30px;">
                        <img id="m-cover" src="" alt="Cover">
                        <div style="flex: 1;">
                            <h2 id="m-title" style="margin: 0 0 10px 0; font-family: serif; color: #111; line-height: 1.2;"></h2>
                            <div id="m-author" style="color: #666; font-size: 1.1rem;"></div>
                            <div id="m-rating" style="color: #b8860b; margin: 15px 0; font-size: 1.2rem;"></div>
                            <div id="m-date" style="font-size: 0.85rem; color: #888; background: #f0f0f0; padding: 4px 12px; border-radius: 20px; display: inline-block;"></div>
                        </div>
                    </div>
                    <div id="m-highlights"></div>
                </div>
                <div class="book-spine-crease"></div>
                <div class="page right">
                    <div style="font-size: 0.8rem; color: #999; font-weight: bold; margin-bottom: 20px; letter-spacing: 2px; border-bottom: 1px solid #eee; padding-bottom: 8px;">REFLECTIONS</div>
                    <div id="m-thoughts" style="line-height: 2; white-space: pre-wrap; font-size: 1.05rem; color: #333;"></div>
                </div>
            </div>
            <div class="modal-nav">
                <button class="nav-btn prev-btn" onclick="changeBook(-1)"><i class="fas fa-chevron-left"></i> PREVIOUS</button>
                <button class="nav-btn next-btn" onclick="changeBook(1)">NEXT <i class="fas fa-chevron-right"></i></button>
            </div>
        </div>
    </div>

    <script>
        const bookBackgrounds = [
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg1.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg2.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg3.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg4.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg5.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg6.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg7.png'
        ];

        let allBooks = [];
        let currentYearBooks = [];
        let currentIdx = -1;

        async function init() {
            try {
                const response = await fetch('books.json');
                allBooks = await response.json();
                renderBookshelf();
                enableDragScroll();
            } catch (e) { console.error("Data Load Error"); }
        }

        function renderBookshelf() {
            const container = document.getElementById('main-bookshelf');
            container.innerHTML = '';
            
            // 年份由大到小排序 (2026 -> 2025)
            const years = [...new Set(allBooks.map(b => b.year))].sort((a, b) => b - a);

            years.forEach(year => {
                // 排序邏輯：同一年份內，日期越新的排在越左邊 (Index 0)
                const yearBooks = allBooks
                    .filter(b => b.year === year)
                    .sort((a, b) => {
                        const dateA = new Date(a["Date Finished"] || a.date || a.year);
                        const dateB = new Date(b["Date Finished"] || b.date || b.year);
                        return dateB - dateA; 
                    });

                const section = document.createElement('div');
                section.innerHTML = `
                    <div class="year-label">${year} COLLECTION <span class="book-count">(${yearBooks.length} BOOKS)</span></div>
                    <div class="shelf">
                        <div class="books-row" id="shelf-${year}"></div>
                        <div class="shelf-board"></div>
                    </div>
                `;
                container.appendChild(section);

                const row = document.getElementById(`shelf-${year}`);
                yearBooks.forEach((book, index) => {
                    const bookEl = document.createElement('div');
                    bookEl.className = 'book';
                    const bg = bookBackgrounds[Math.floor(Math.random() * bookBackgrounds.length)];
                    const h = 210 + Math.floor(Math.random() * 35);
                    const w = book.title.length > 8 ? 88 : 62;
                    bookEl.style.backgroundImage = `url('${bg}')`;
                    bookEl.style.height = `${h}px`;
                    bookEl.style.width = `${w}px`;
                    bookEl.innerHTML = `<div class="spine-text">${book.title}</div>`;
                    bookEl.onclick = () => openModal(yearBooks, index);
                    row.appendChild(bookEl);
                });
            });
        }

        function openModal(booksArray, index) {
            currentYearBooks = booksArray;
            currentIdx = index;
            updateModalContent();
            document.getElementById('book-modal').style.display = "block";
            document.body.style.overflow = 'hidden';
        }

        function updateModalContent() {
            const book = currentYearBooks[currentIdx];
            document.getElementById('m-title').innerText = book.title;
            document.getElementById('m-author').innerText = book.author;
            document.getElementById('m-rating').innerText = book.rating;
            document.getElementById('m-date').innerText = `Finished: ${book["Date Finished"] || book.year}`;
            
            const img = document.getElementById('m-cover');
            img.src = book.cover || '';
            img.style.display = book.cover ? 'block' : 'none';

            let thoughts = "", highlights = "";
            if (book.note) {
                const parts = book.note.split('【劃線金句】');
                thoughts = parts[0].replace('【我的心得】', '').trim();
                highlights = parts[1] ? parts[1].trim() : "";
            }

            const hContainer = document.getElementById('m-highlights');
            hContainer.innerHTML = '';
            if (highlights) {
                highlights.split(/\n\s*\n/).forEach(text => {
                    if(text.trim()){
                        const div = document.createElement('div');
                        div.className = 'highlight-item';
                        div.innerText = text.trim();
                        hContainer.appendChild(div);
                    }
                });
            }
            document.getElementById('m-thoughts').innerText = thoughts || "No specific reflections documented.";

            document.querySelector('.prev-btn').disabled = (currentIdx === 0);
            document.querySelector('.next-btn').disabled = (currentIdx === currentYearBooks.length - 1);
            document.querySelector('.open-book').scrollTop = 0;
        }

        function changeBook(step) {
            currentIdx += step;
            updateModalContent();
        }

        function closeModal() { 
            document.getElementById('book-modal').style.display = "none"; 
            document.body.style.overflow = 'auto';
        }

        function enableDragScroll() {
            const sliders = document.querySelectorAll('.books-row');
            sliders.forEach(slider => {
                let isDown = false, startX, scrollLeft;
                slider.addEventListener('mousedown', (e) => {
                    isDown = true; slider.classList.add('active');
                    startX = e.pageX - slider.offsetLeft;
                    scrollLeft = slider.scrollLeft;
                });
                slider.addEventListener('mouseleave', () => isDown = false);
                slider.addEventListener('mouseup', () => isDown = false);
                slider.addEventListener('mousemove', (e) => {
                    if (!isDown) return;
                    e.preventDefault();
                    const x = e.pageX - slider.offsetLeft;
                    const walk = (x - startX) * 2;
                    slider.scrollLeft = scrollLeft - walk;
                });
            });
        }

        window.onclick = (e) => { if (e.target.className === 'modal') closeModal(); }
        init();
    </script>
</body>
</html>
