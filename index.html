<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的私人典藏館 | Luxury Archive</title>
    <style>
        :root {
            --gold-reflect: #f9e29c;
            --shelf-wood: #1a0f0d;
            /* 燙金紋理圖片 */
            --book-texture: url('https://raw.githubusercontent.com/may90358/my-bookshelf/74f71560654c9d3e38ffc33de8ff5bcd1207ad84/book_bg.png');
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=2000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            font-family: "Georgia", "Times New Roman", "serif";
            color: white;
            min-height: 100vh;
        }

        h1 { 
            text-align: center;
            margin: 60px 0; 
            font-weight: bold; 
            letter-spacing: 12px; 
            text-shadow: 0 10px 20px rgba(0,0,0,1);
            color: #d4af37;
        }

        /* 佈局架構 */
        .library-layout {
            display: flex;
            width: 100%;
            justify-content: center;
        }

        .side-view { flex: 1; opacity: 0.2; pointer-events: none; mask-image: linear-gradient(to right, black, transparent); }

        .collection-center {
            flex: 2;
            max-width: 1000px;
            padding: 0 20px 100px;
            z-index: 5;
        }

        .year-label {
            font-size: 1.2rem;
            color: #8d6e63;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 8px;
            margin: 60px 0 30px;
            letter-spacing: 5px;
            text-align: center;
        }

        /* 書架與層板 */
        .shelf { position: relative; margin-bottom: 100px; }
        
        .books-row {
            display: flex;
            align-items: flex-end;
            padding: 0 10px 4px;
            gap: 2px;
            height: 260px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .books-row::-webkit-scrollbar { display: none; }

        /* [關鍵修改] 深色精裝書脊樣式 */
        .book {
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            flex-shrink: 0;
            border-radius: 2px 5px 5px 2px;
            
            /* 1. 核心背景：疊加深色漸層與燙金紋理圖片 */
            background-image: linear-gradient(to right, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0) 80%, rgba(0,0,0,0.4) 100%), var(--book-texture);
            background-size: cover;
            background-position: center;
            background-blend-mode: multiply; /* 讓背景色與圖片完美融合 */

            /* 2. 立體感陰影：模擬精裝書左側的壓痕 */
            box-shadow: 
                inset 6px 0 8px -2px rgba(0,0,0,0.8), 
                inset -2px 0 5px rgba(0,0,0,0.3),
                8px 5px 20px rgba(0,0,0,0.7);
            
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .book:hover {
            transform: translateY(-35px) rotateZ(1deg);
            z-index: 50;
            box-shadow: 15px 20px 40px rgba(0,0,0,0.9);
            filter: brightness(1.2);
        }

        /* 燙金字體效果 */
        .spine-text {
            writing-mode: vertical-rl;
            color: #f9e29c; /* 經典金箔色 */
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 3px;
            /* 壓印感陰影 */
            text-shadow: 
                -1px -1px 0 rgba(0,0,0,0.5), 
                1px 1px 0 rgba(255,255,255,0.2);
            padding: 20px 0;
            text-align: center;
            pointer-events: none;
            word-break: break-all;
        }

        /* 木頭層板 */
        .shelf-board {
            height: 32px;
            background: linear-gradient(to bottom, #3e2723, #1a0f0d);
            width: 100%;
            border-radius: 2px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        /* 彈窗樣式 */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); backdrop-filter: blur(15px); }
        .modal-content { margin: 5vh auto; width: 90%; max-width: 1100px; position: relative; }
        .open-book { display: flex; background-color: #fff; box-shadow: 0 50px 100px rgba(0,0,0,0.9); height: 85vh; border-radius: 4px; overflow: hidden; }
        .page { flex: 1; padding: 45px; overflow-y: auto; color: #1a1a1a; line-height: 1.8; }
        .page.left { background: #fdfdfd; border-right: 1px solid #eee; }
        .book-spine-crease { width: 25px; background: linear-gradient(to right, #ccc, #f5f5f5 50%, #ccc); flex-shrink: 0; }
        .highlight-item { background: #f4f1ea; padding: 20px; margin-bottom: 15px; border-left: 5px solid #d4af37; font-style: italic; color: #444; border-radius: 2px; }
        .close-btn { position: absolute; right: -50px; top: -10px; font-size: 50px; color: white; cursor: pointer; }

        @media (max-width: 900px) {
            .side-view { display: none; }
        }
    </style>
</head>
<body>

    <h1>CURATED ARCHIVE</h1>

    <div class="library-layout">
        <div class="side-view"></div>
        <div class="collection-center" id="main-bookshelf"></div>
        <div class="side-view"></div>
    </div>

    <div id="note-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="open-book">
                <div class="page left">
                    <div style="display: flex; gap: 25px; margin-bottom: 40px;">
                        <img id="modal-cover-img" style="width: 140px; border-radius: 4px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);" src="" alt="">
                        <div>
                            <h2 id="modal-title" style="margin: 0 0 15px 0; font-family: serif; font-size: 1.8rem;"></h2>
                            <div id="modal-author" style="color: #555; font-size: 1.1rem;"></div>
                            <div id="modal-rating" style="color: #d4af37; margin: 15px 0; font-size: 1.2rem;"></div>
                            <div id="modal-date" style="font-size: 0.85rem; border: 1px solid #ccc; padding: 4px 12px; border-radius: 2px; color: #777;"></div>
                        </div>
                    </div>
                    <div id="modal-highlights"></div>
                </div>
                <div class="book-spine-crease"></div>
                <div class="page right">
                    <div style="font-size: 0.9rem; color: #d4af37; font-weight: bold; margin-bottom: 20px; border-bottom: 2px solid #f4f1ea; letter-spacing: 3px;">REFLECTIONS</div>
                    <div id="modal-thoughts" style="color: #333; white-space: pre-wrap; font-size: 1.1rem;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function init() {
            try {
                const response = await fetch('books.json');
                const data = await response.json();
                data.sort((a, b) => b.year - a.year); 
                renderBookshelf(data);
            } catch (e) { console.error("Data Load Error"); }
        }

        function renderBookshelf(data) {
            const mainContainer = document.getElementById('main-bookshelf');
            mainContainer.innerHTML = '';
            const years = [...new Set(data.map(b => b.year))].sort((a, b) => b - a);

            years.forEach(year => {
                const section = document.createElement('div');
                section.innerHTML = `
                    <div class="year-label">${year} COLLECTION</div>
                    <div class="shelf">
                        <div class="books-row" id="shelf-${year}"></div>
                        <div class="shelf-board"></div>
                    </div>
                `;
                mainContainer.appendChild(section);

                const row = document.getElementById(`shelf-${year}`);
                data.filter(b => b.year === year).forEach(book => {
                    const bookEl = document.createElement('div');
                    bookEl.className = 'book';
                    
                    // 根據書名長度動態調整，並將顏色變暗/加深
                    const height = 200 + Math.floor(Math.random() * 35);
                    const width = book.title.length > 7 ? 75 : 55;
                    
                    // 讓原本 Notion 的顏色與深黑色混合，達到「暗一點、深一點」的效果
                    const baseColor = book.color || '#2c3e50';
                    bookEl.style.backgroundColor = baseColor;
                    bookEl.style.height = `${height}px`;
                    bookEl.style.width = `${width}px`;
                    
                    bookEl.innerHTML = `<div class="spine-text">${book.title}</div>`;
                    bookEl.onclick = () => openNote(book);
                    row.appendChild(bookEl);
                });
            });
        }

        function openNote(book) {
            document.getElementById('modal-title').innerText = book.title;
            document.getElementById('modal-author').innerText = book.author;
            document.getElementById('modal-rating').innerText = book.rating;
            document.getElementById('modal-date').innerText = `Catalogued: ${book.year}`;
            const coverImg = document.getElementById('modal-cover-img');
            coverImg.src = book.cover || '';
            coverImg.style.display = book.cover ? 'block' : 'none';

            let thoughts = "No entries.", rawHighlights = "";
            if (book.note) {
                const parts = book.note.split('【劃線金句】');
                thoughts = parts[0].replace('【我的心得】', '').trim();
                rawHighlights = parts[1] ? parts[1].trim() : "";
            }

            const hContainer = document.getElementById('modal-highlights');
            hContainer.innerHTML = '';
            if (rawHighlights) {
                rawHighlights.split(/\n\s*\n/).forEach(text => {
                    const item = document.createElement('div');
                    item.className = 'highlight-item';
                    item.innerText = text.trim();
                    hContainer.appendChild(item);
                });
            }
            document.getElementById('modal-thoughts').innerText = thoughts;
            document.getElementById('note-modal').style.display = "block";
        }

        function closeModal() { document.getElementById('note-modal').style.display = "none"; }
        window.onclick = (e) => { if (e.target.className === 'modal') closeModal(); }
        init();
    </script>
</body>
</html>
