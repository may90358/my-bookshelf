<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的互動書櫃 | Notion 同步版</title>
    <style>
        :root {
            --shelf-color: #5d4037;
            --shelf-depth: #3e2723;
            --wall-color: #f4f1ea;
            --paper-color: #fafafa;
            --ink-color: #2c3e50;
            --accent-color: #8d6e63;
        }

        body {
            background-color: var(--wall-color);
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            margin: 0;
            padding-bottom: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin: 60px 0 20px;
            color: #2c3e50;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* --- 書架顯示區 --- */
        .bookshelf-container {
            width: 90%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
        }

        .year-section { margin-top: 50px; }

        .year-label {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--accent-color);
            margin-left: 10px;
            margin-bottom: 8px;
            border-left: 5px solid var(--shelf-color);
            padding-left: 15px;
        }

        .shelf { position: relative; margin-bottom: 30px; }

        .books-row {
            display: flex;
            align-items: flex-end;
            padding: 0 40px;
            gap: 4px;
            height: 240px;
            z-index: 2;
            position: relative;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .books-row::-webkit-scrollbar { display: none; }

        .book {
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 2px 0 5px rgba(0,0,0,0.3);
            border-radius: 2px 4px 4px 2px;
            border-left: 2px solid rgba(255,255,255,0.1);
            flex-shrink: 0;
        }

        .book:hover {
            transform: translateY(-20px) scale(1.05);
            z-index: 10;
            filter: brightness(1.1);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }

        .spine-text {
            writing-mode: vertical-rl;
            color: white;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            white-space: nowrap;
            overflow: hidden;
            max-height: 80%;
            padding: 10px 0;
        }

        .shelf-board {
            height: 20px;
            background: linear-gradient(to bottom, var(--shelf-color), var(--shelf-depth));
            width: 100%;
            border-radius: 4px;
            z-index: 3;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
        }

        /* --- 彈窗 UI (左：資+金句 / 右：心得) --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: #fff;
            margin: 5vh auto;
            width: 90%;
            max-width: 1000px;
            border-radius: 12px;
            position: relative;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            max-height: 85vh;
            display: flex;
            overflow: hidden;
            animation: modalIn 0.3s ease-out;
        }

        @keyframes modalIn {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* 左側：書本基本資訊 + 金句 */
        .modal-left {
            width: 45%;
            padding: 40px;
            background-color: #fcfaf7;
            border-right: 1px solid #eee;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .book-header {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .book-cover-large {
            width: 140px;
            height: 200px;
            object-fit: cover;
            border-radius: 4px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            background-color: #eee;
            flex-shrink: 0;
        }

        .book-main-info {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .modal-title { font-size: 1.5rem; color: #333; margin: 0 0 8px 0; line-height: 1.3; }
        .modal-author { font-size: 1rem; color: #7f8c8d; margin-bottom: 10px; }
        .modal-rating { font-size: 1.2rem; color: #f1c40f; margin-bottom: 15px; }
        .modal-date {
            font-size: 0.85rem;
            color: #95a5a6;
            background: #fff;
            padding: 4px 12px;
            border-radius: 15px;
            border: 1px solid #eee;
            width: fit-content;
        }

        .section-label {
            font-size: 0.8rem;
            color: var(--accent-color);
            font-weight: bold;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
            display: block;
            border-bottom: 1px solid #e0dcd5;
            padding-bottom: 5px;
        }

        .highlight-section {
            line-height: 1.8;
            font-size: 1rem;
            color: #555;
            white-space: pre-wrap;
            font-style: italic;
        }

        /* 右側：純心得 */
        .modal-right {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            background-color: #fff;
        }

        .thought-section {
            line-height: 2;
            font-size: 1.1rem;
            color: #2c3e50;
            white-space: pre-wrap;
        }

        .close-btn {
            position: absolute;
            right: 20px;
            top: 15px;
            font-size: 30px;
            cursor: pointer;
            color: #bdc3c7;
            z-index: 10;
        }

        .close-btn:hover { color: #333; }

        @media (max-width: 850px) {
            .modal-content { flex-direction: column; }
            .modal-left, .modal-right { width: 100%; border-right: none; }
        }
    </style>
</head>
<body>

    <h1>My Reading Shelf</h1>

    <div class="bookshelf-container" id="main-bookshelf"></div>

    <div id="note-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            
            <div class="modal-left">
                <div class="book-header">
                    <img id="modal-cover" class="book-cover-large" src="" alt="封面">
                    <div class="book-main-info">
                        <h2 id="modal-title" class="modal-title">書名</h2>
                        <div id="modal-author" class="modal-author">作者</div>
                        <div id="modal-rating" class="modal-rating">★★★★★</div>
                        <div id="modal-date" class="modal-date">完讀年份</div>
                    </div>
                </div>
                
                <span class="section-label">HIGHLIGHTS / 金句</span>
                <div id="modal-highlights" class="highlight-section"></div>
            </div>

            <div class="modal-right">
                <span class="section-label">REFLECTIONS / 心得</span>
                <div id="modal-thoughts" class="thought-section"></div>
            </div>
        </div>
    </div>

    <script>
        async function init() {
            try {
                const response = await fetch('books.json');
                const data = await response.json();
                renderBookshelf(data);
            } catch (e) {
                console.error("無法加載書籍資料");
            }
        }

        function renderBookshelf(data) {
            const mainContainer = document.getElementById('main-bookshelf');
            mainContainer.innerHTML = '';
            const years = [...new Set(data.map(b => b.year))].sort((a, b) => b - a);

            years.forEach(year => {
                const section = document.createElement('div');
                section.className = 'year-section';
                section.innerHTML = `
                    <div class="year-label">${year} 年</div>
                    <div class="shelf">
                        <div class="books-row" id="shelf-${year}"></div>
                        <div class="shelf-board"></div>
                    </div>
                `;
                mainContainer.appendChild(section);

                const row = document.getElementById(`shelf-${year}`);
                data.filter(b => b.year === year).forEach(book => {
                    const bookEl = document.createElement('div');
                    bookEl.className = 'book';
                    bookEl.style.backgroundColor = book.color;
                    bookEl.style.height = `${book.height}px`;
                    bookEl.style.width = `${book.width}px`;
                    bookEl.innerHTML = `<div class="spine-text">${book.title}</div>`;
                    bookEl.onclick = () => openNote(book);
                    row.appendChild(bookEl);
                });
            });
        }

        function openNote(book) {
            document.getElementById('modal-title').innerText = book.title;
            document.getElementById('modal-author').innerText = book.author;
            document.getElementById('modal-rating').innerText = book.rating;
            document.getElementById('modal-date').innerText = `Finished in ${book.year}`;
            document.getElementById('modal-cover').src = book.cover || 'https://via.placeholder.com/140x200?text=No+Cover';

            // 拆分心得與金句 (假設你的 fetch_notion.js 輸出的格式有 【劃線金句】 字樣)
            const parts = book.note.split('【劃線金句】');
            const thoughts = parts[0].replace('【我的心得】', '').trim();
            const highlights = parts[1] ? parts[1].trim() : "尚無金句紀錄";

            document.getElementById('modal-thoughts').innerText = thoughts;
            document.getElementById('modal-highlights').innerText = highlights;

            document.getElementById('note-modal').style.display = "block";
        }

        function closeModal() {
            document.getElementById('note-modal').style.display = "none";
        }

        window.onclick = (e) => { if (e.target.className === 'modal') closeModal(); }
        init();
    </script>
</body>
</html>
