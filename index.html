<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Bookshelf</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-color: #121212;
            --shelf-color: #2a1b15;
            --gold-accent: #eec16d;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            /* 使用深色漸層營造氛圍，不使用圖片背景 */
            background: radial-gradient(circle at top, #1e1e1e 0%, #121212 100%);
            font-family: "Georgia", "PingFang TC", "serif";
            color: #eee;
            min-height: 100vh;
        }

        h1 { 
            text-align: center; 
            margin: 50px 0 30px; 
            font-weight: 300; 
            letter-spacing: 5px; 
            color: var(--gold-accent);
            text-transform: uppercase;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px 100px;
        }

        .year-section { margin-bottom: 60px; }

        .year-label {
            font-size: 1.2rem;
            color: var(--gold-accent);
            margin-bottom: 15px;
            padding-left: 5px;
            border-left: 3px solid var(--gold-accent);
            line-height: 1;
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .book-count {
            font-size: 0.8rem;
            color: #666;
            font-weight: normal;
        }

        /* 書架本體 */
        .shelf-container { position: relative; }

        .books-row {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            padding: 0 10px 5px;
            overflow-x: auto;
            scrollbar-width: none; /* Firefox */
            height: 270px;
            cursor: grab;
        }
        .books-row::-webkit-scrollbar { display: none; }

        .book {
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.3s ease, filter 0.3s ease;
            position: relative;
            background-size: 100% 100%;
            box-shadow: 3px 5px 15px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 2px 3px 3px 2px;
        }

        .book:hover {
            transform: translateY(-15px) scale(1.05);
            filter: brightness(1.1);
            z-index: 5;
        }

        .spine-text {
            writing-mode: vertical-rl;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            letter-spacing: 1px;
            text-align: center;
            pointer-events: none;
            max-height: 85%;
            overflow: hidden;
        }

        /* 木質層板 */
        .shelf-board {
            height: 20px;
            background: linear-gradient(to bottom, #3d2b1f, #2a1b15);
            border-radius: 2px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6);
            width: 100%;
        }

        /* 彈窗 Modal */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(5px); }
        .modal-content {
            background: #fff;
            color: #333;
            width: 90%;
            max-width: 900px;
            height: 80vh;
            margin: 10vh auto;
            position: relative;
            display: flex;
            flex-direction: column;
            border-radius: 5px;
            overflow: hidden;
        }

        .close-btn { position: absolute; right: 20px; top: 15px; font-size: 30px; cursor: pointer; color: #999; z-index: 1100; }

        .book-detail-view { display: flex; flex: 1; overflow-y: auto; }
        .detail-page { flex: 1; padding: 40px; }
        .left-page { border-right: 1px solid #eee; background: #fafafa; }
        
        #m-cover { width: 140px; height: auto; border-radius: 4px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .info-header h2 { margin: 0 0 5px 0; color: #111; }
        .info-header p { margin: 0; color: #777; }
        
        .rating { color: #d4af37; margin: 15px 0; font-size: 1.2rem; }
        .highlight-box { background: #fff; border-left: 4px solid var(--gold-accent); padding: 15px; margin-top: 20px; font-style: italic; color: #555; line-height: 1.6; }

        .right-page h3 { font-size: 0.9rem; color: #bbb; letter-spacing: 2px; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-top: 0; }
        .thought-text { line-height: 1.8; color: #444; white-space: pre-wrap; }

        .modal-footer { padding: 15px 40px; background: #f5f5f5; display: flex; justify-content: space-between; }
        .nav-btn { padding: 10px 20px; border: none; background: #333; color: white; border-radius: 4px; cursor: pointer; }
        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        @media (max-width: 768px) {
            .book-detail-view { flex-direction: column; }
            .detail-page { padding: 25px; }
        }
    </style>
</head>
<body>

    <h1>Reading Archive</h1>

    <div class="container" id="bookshelf-container"></div>

    <div id="book-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="book-detail-view">
                <div class="detail-page left-page">
                    <img id="m-cover" src="" alt="">
                    <div class="info-header">
                        <h2 id="m-title"></h2>
                        <p id="m-author"></p>
                    </div>
                    <div id="m-rating" class="rating"></div>
                    <div id="m-highlights"></div>
                </div>
                <div class="detail-page right-page">
                    <h3>REFLECTIONS</h3>
                    <div id="m-thoughts" class="thought-text"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="nav-btn" id="prevBtn" onclick="changeBook(-1)">PREVIOUS</button>
                <button class="nav-btn" id="nextBtn" onclick="changeBook(1)">NEXT</button>
            </div>
        </div>
    </div>

    <script>
        const bookBackgrounds = [
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg1.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg2.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg3.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg4.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg5.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg6.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg7.png'
        ];

        let allBooks = [];
        let currentYearBooks = [];
        let currentIdx = -1;

        async function init() {
            try {
                const response = await fetch('books.json');
                allBooks = await response.json();
                renderBookshelf();
                enableDragScroll();
            } catch (e) {
                console.error("Failed to load books.json");
            }
        }

        function renderBookshelf() {
            const container = document.getElementById('bookshelf-container');
            container.innerHTML = '';

            const years = [...new Set(allBooks.map(b => b.year))].sort((a, b) => b - a);

            years.forEach(year => {
                // 排序：最新的日期排在最前面 (Index 0, 左邊)
                const yearBooks = allBooks
                    .filter(b => b.year === year)
                    .sort((a, b) => {
                        const dateA = new Date(a["Date Finished"] || a.date || a.year);
                        const dateB = new Date(b["Date Finished"] || b.date || b.year);
                        return dateB - dateA;
                    });

                const section = document.createElement('div');
                section.className = 'year-section';
                section.innerHTML = `
                    <div class="year-label">${year} <span class="book-count">/ ${yearBooks.length} BOOKS</span></div>
                    <div class="shelf-container">
                        <div class="books-row" id="shelf-${year}"></div>
                        <div class="shelf-board"></div>
                    </div>
                `;
                container.appendChild(section);

                const row = document.getElementById(`shelf-${year}`);
                yearBooks.forEach((book, index) => {
                    const bookEl = document.createElement('div');
                    bookEl.className = 'book';
                    
                    // 隨機書脊樣式
                    const bg = bookBackgrounds[Math.floor(Math.random() * bookBackgrounds.length)];
                    const h = 200 + Math.floor(Math.random() * 40);
                    const w = book.title.length > 8 ? 80 : 55;
                    
                    bookEl.style.backgroundImage = `url('${bg}')`;
                    bookEl.style.height = `${h}px`;
                    bookEl.style.width = `${w}px`;
                    bookEl.innerHTML = `<div class="spine-text">${book.title}</div>`;
                    
                    bookEl.onclick = () => openModal(yearBooks, index);
                    row.appendChild(bookEl);
                });
            });
        }

        function openModal(booksArray, index) {
            currentYearBooks = booksArray;
            currentIdx = index;
            updateModalContent();
            document.getElementById('book-modal').style.display = "block";
            document.body.style.overflow = 'hidden';
        }

        function updateModalContent() {
            const book = currentYearBooks[currentIdx];
            document.getElementById('m-title').innerText = book.title;
            document.getElementById('m-author').innerText = book.author;
            document.getElementById('m-rating').innerText = book.rating;
            
            const coverImg = document.getElementById('m-cover');
            if (book.cover) {
                coverImg.src = book.cover;
                coverImg.style.display = 'block';
            } else {
                coverImg.style.display = 'none';
            }

            // 解析心得與金句
            let thoughts = "", highlights = "";
            if (book.note) {
                const parts = book.note.split('【劃線金句】');
                thoughts = parts[0].replace('【我的心得】', '').trim();
                highlights = parts[1] ? parts[1].trim() : "";
            }
            
            document.getElementById('m-thoughts').innerText = thoughts || "尚未填寫心得。";
            
            const hContainer = document.getElementById('m-highlights');
            hContainer.innerHTML = '';
            if (highlights) {
                highlights.split(/\n\s*\n/).forEach(text => {
                    if (text.trim()) {
                        const div = document.createElement('div');
                        div.className = 'highlight-box';
                        div.innerText = text.trim();
                        hContainer.appendChild(div);
                    }
                });
            }

            document.getElementById('prevBtn').disabled = (currentIdx === 0);
            document.getElementById('nextBtn').disabled = (currentIdx === currentYearBooks.length - 1);
        }

        function changeBook(step) {
            currentIdx += step;
            updateModalContent();
        }

        function closeModal() {
            document.getElementById('book-modal').style.display = "none";
            document.body.style.overflow = 'auto';
        }

        function enableDragScroll() {
            const sliders = document.querySelectorAll('.books-row');
            sliders.forEach(slider => {
                let isDown = false, startX, scrollLeft;
                slider.addEventListener('mousedown', (e) => {
                    isDown = true;
                    startX = e.pageX - slider.offsetLeft;
                    scrollLeft = slider.scrollLeft;
                });
                slider.addEventListener('mouseleave', () => isDown = false);
                slider.addEventListener('mouseup', () => isDown = false);
                slider.addEventListener('mousemove', (e) => {
                    if (!isDown) return;
                    e.preventDefault();
                    const x = e.pageX - slider.offsetLeft;
                    const walk = (x - startX) * 2;
                    slider.scrollLeft = scrollLeft - walk;
                });
            });
        }

        window.onclick = (e) => { if (e.target.className === 'modal') closeModal(); }

        init();
    </script>
</body>
</html>
