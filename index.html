<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的私人典藏館 | Luxury Archive</title>
    <style>
        :root {
            --gold-bright: #ffd700;
            --gold-text: #eec16d;
            --shelf-wood: #2b1d1a;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=2000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            font-family: "Georgia", "Times New Roman", "serif";
            color: white;
            min-height: 100vh;
        }

        h1 { 
            text-align: center;
            margin: 60px 0; 
            font-weight: bold; 
            letter-spacing: 12px; 
            text-shadow: 0 5px 15px rgba(0,0,0,0.8);
            color: var(--gold-text);
        }

        .library-layout {
            display: flex;
            width: 100%;
            justify-content: center;
        }

        .side-view { flex: 0.5; opacity: 0.2; pointer-events: none; }

        .collection-center {
            flex: 3;
            max-width: 1200px;
            padding: 0 20px 100px;
            z-index: 5;
        }

        /* 年份標題：金色、置左、包含數量 */
        .year-label {
            font-size: 1.5rem;
            color: var(--gold-bright);
            border-bottom: 2px solid rgba(255, 215, 0, 0.4);
            padding-bottom: 10px;
            margin: 60px 0 25px;
            letter-spacing: 3px;
            text-align: left;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .book-count {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.7);
            margin-left: 15px;
            font-family: sans-serif;
            font-weight: normal;
        }

        /* 書架容器 */
        .shelf { position: relative; margin-bottom: 80px; }
        
        /* 支援拖拉捲動的容器 */
        .books-row {
            display: flex;
            align-items: flex-end;
            padding: 0 10px 5px;
            gap: 4px;
            height: 300px;
            overflow-x: auto;
            scrollbar-width: none; /* Firefox */
            cursor: grab;
            user-select: none;
        }
        .books-row::-webkit-scrollbar { display: none; } /* Chrome/Safari */
        .books-row:active { cursor: grabbing; }

        /* 精裝書脊樣式 */
        .book {
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            flex-shrink: 0;
            border-radius: 2px 5px 5px 2px;
            background-size: 100% 100%;
            background-position: center;
            /* 移除深色 multiply，直接呈現圖片原始亮度，僅保留左右微弱光影讓它立體 */
            background-image: linear-gradient(to right, rgba(0,0,0,0.15) 0%, transparent 15%, transparent 85%, rgba(0,0,0,0.15) 100%);
            
            box-shadow: 
                inset 4px 0 6px -2px rgba(0,0,0,0.3), 
                4px 5px 15px rgba(0,0,0,0.5);
            
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .book:hover {
            transform: translateY(-30px);
            z-index: 50;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            filter: brightness(1.1);
        }

        .spine-text {
            writing-mode: vertical-rl;
            color: #fcf4d9; /* 淺金黃 */
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
            padding: 20px 0;
            text-align: center;
            pointer-events: none;
            word-break: break-all;
            max-height: 85%;
        }

        .shelf-board {
            height: 30px;
            background: linear-gradient(to bottom, #4e342e, #1a0f0d);
            width: 100%;
            border-radius: 2px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        /* 彈窗樣式 */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); }
        .modal-content { margin: 5vh auto; width: 90%; max-width: 1000px; position: relative; }
        .open-book { display: flex; background-color: #fff; box-shadow: 0 50px 100px rgba(0,0,0,0.9); height: 85vh; border-radius: 4px; overflow: hidden; }
        .page { flex: 1; padding: 40px; overflow-y: auto; color: #333; }
        .page.left { background: #fafafa; border-right: 1px solid #eee; }
        .book-spine-crease { width: 20px; background: linear-gradient(to right, #ddd, #fff 50%, #ddd); flex-shrink: 0; }
        .highlight-item { background: #f8f5f0; padding: 15px; margin-bottom: 12px; border-left: 5px solid var(--gold-bright); color: #555; border-radius: 2px; line-height: 1.8; }
        .close-btn { position: absolute; right: -50px; top: -10px; font-size: 50px; color: white; cursor: pointer; }

        @media (max-width: 800px) {
            .side-view { display: none; }
        }
    </style>
</head>
<body>

    <h1>PRIVATE LIBRARY</h1>

    <div class="library-layout">
        <div class="side-view"></div>
        <div class="collection-center" id="main-bookshelf"></div>
        <div class="side-view"></div>
    </div>

    <div id="note-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="open-book">
                <div class="page left">
                    <div style="display: flex; gap: 20px; margin-bottom: 30px;">
                        <img id="modal-cover-img" style="width: 120px; border-radius: 4px; box-shadow: 0 5px 15px rgba(0,0,0,0.2);" src="" alt="">
                        <div>
                            <h2 id="modal-title" style="margin: 0 0 10px 0; font-family: serif;"></h2>
                            <div id="modal-author" style="color: #666;"></div>
                            <div id="modal-rating" style="color: #d4af37; margin: 10px 0;"></div>
                            <div id="modal-date" style="font-size: 0.8rem; background: #eee; padding: 3px 10px; border-radius: 10px;"></div>
                        </div>
                    </div>
                    <div id="modal-highlights"></div>
                </div>
                <div class="book-spine-crease"></div>
                <div class="page right">
                    <div style="font-size: 0.8rem; color: #b8860b; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #eee;">REFLECTIONS</div>
                    <div id="modal-thoughts" style="line-height: 2; white-space: pre-wrap;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const bookBackgrounds = [
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg1.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg2.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg3.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg4.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg5.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg6.png',
            'https://raw.githubusercontent.com/may90358/my-bookshelf/refs/heads/main/images/book_bg7.png'
        ];

        async function init() {
            try {
                const response = await fetch('books.json');
                const data = await response.json();
                
                // 這裡假設 JSON 中有日期或是順序，如果沒有，會依照原始 JSON 的倒序排列
                // 讓最新的書放在左邊
                data.reverse(); 

                renderBookshelf(data);
                enableDragScroll();
            } catch (e) { console.error("Load Error"); }
        }

        function renderBookshelf(data) {
            const mainContainer = document.getElementById('main-bookshelf');
            mainContainer.innerHTML = '';
            
            // 取得年份並排序（最新的年份在最上面）
            const years = [...new Set(data.map(b => b.year))].sort((a, b) => b - a);

            years.forEach(year => {
                const yearBooks = data.filter(b => b.year === year);
                const section = document.createElement('div');
                section.innerHTML = `
                    <div class="year-label">
                        ${year} COLLECTION 
                        <span class="book-count">(${yearBooks.length} BOOKS)</span>
                    </div>
                    <div class="shelf">
                        <div class="books-row" id="shelf-${year}"></div>
                        <div class="shelf-board"></div>
                    </div>
                `;
                mainContainer.appendChild(section);

                const row = document.getElementById(`shelf-${year}`);
                yearBooks.forEach(book => {
                    const bookEl = document.createElement('div');
                    bookEl.className = 'book';
                    
                    const randomBg = bookBackgrounds[Math.floor(Math.random() * bookBackgrounds.length)];
                    const height = 210 + Math.floor(Math.random() * 40);
                    const width = book.title.length > 7 ? 75 : 55;
                    
                    // 移除 deep color 處理，直接顯示圖片
                    bookEl.style.backgroundImage = `linear-gradient(to right, rgba(0,0,0,0.1) 0%, transparent 15%, transparent 85%, rgba(0,0,0,0.1) 100%), url('${randomBg}')`;
                    bookEl.style.height = `${height}px`;
                    bookEl.style.width = `${width}px`;
                    
                    bookEl.innerHTML = `<div class="spine-text">${book.title}</div>`;
                    bookEl.onclick = () => openNote(book);
                    row.appendChild(bookEl);
                });
            });
        }

        // 拖拉捲動功能
        function enableDragScroll() {
            const sliders = document.querySelectorAll('.books-row');
            sliders.forEach(slider => {
                let isDown = false;
                let startX;
                let scrollLeft;

                slider.addEventListener('mousedown', (e) => {
                    isDown = true;
                    slider.classList.add('active');
                    startX = e.pageX - slider.offsetLeft;
                    scrollLeft = slider.scrollLeft;
                });
                slider.addEventListener('mouseleave', () => {
                    isDown = false;
                });
                slider.addEventListener('mouseup', () => {
                    isDown = false;
                });
                slider.addEventListener('mousemove', (e) => {
                    if (!isDown) return;
                    e.preventDefault();
                    const x = e.pageX - slider.offsetLeft;
                    const walk = (x - startX) * 2; // 捲動速度
                    slider.scrollLeft = scrollLeft - walk;
                });
            });
        }

        function openNote(book) {
            document.getElementById('modal-title').innerText = book.title;
            document.getElementById('modal-author').innerText = book.author;
            document.getElementById('modal-rating').innerText = book.rating;
            document.getElementById('modal-date').innerText = `Finished: ${book.year}`;
            const coverImg = document.getElementById('modal-cover-img');
            coverImg.src = book.cover || '';
            coverImg.style.display = book.cover ? 'block' : 'none';

            let thoughts = "No entries.", rawHighlights = "";
            if (book.note) {
                const parts = book.note.split('【劃線金句】');
                thoughts = parts[0].replace('【我的心得】', '').trim();
                rawHighlights = parts[1] ? parts[1].trim() : "";
            }

            const hContainer = document.getElementById('modal-highlights');
            hContainer.innerHTML = '';
            if (rawHighlights) {
                rawHighlights.split(/\n\s*\n/).forEach(text => {
                    const item = document.createElement('div');
                    item.className = 'highlight-item';
                    item.innerText = text.trim();
                    hContainer.appendChild(item);
                });
            }
            document.getElementById('modal-thoughts').innerText = thoughts;
            document.getElementById('note-modal').style.display = "block";
        }

        function closeModal() { document.getElementById('note-modal').style.display = "none"; }
        window.onclick = (e) => { if (e.target.className === 'modal') closeModal(); }
        init();
    </script>
</body>
</html>
